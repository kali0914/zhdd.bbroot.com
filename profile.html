<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 · ZHDD网安空间</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;
            background:#0b0e14; color:#e8edf5;
            min-height:100vh; display:flex; flex-direction:column;
        }
        a { text-decoration:none; color:inherit; }

        /* 导航栏（同 index） */
        .navbar {
            background:rgba(13,18,28,0.92);
            backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(0,255,200,0.15);
            padding:0 2rem;
            height:72px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 4px 30px rgba(0,0,0,0.5);
        }
        .logo { display:flex; align-items:center; gap:10px; font-size:1.5rem; font-weight:700; letter-spacing:1px; color:#00f5d4; text-shadow:0 0 20px rgba(0,245,212,0.2); }
        .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,#00f5d4,#0077b6); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#0b0e14; box-shadow:0 0 20px rgba(0,245,212,0.25); }
        .nav-links { display:flex; gap:4px; list-style:none; align-items:center; }
        .nav-links li { display:inline; }
        .nav-btn { background:transparent; border:none; color:#a0b4c8; font-size:1rem; font-weight:500; padding:8px 18px; border-radius:30px; cursor:pointer; transition:all .25s ease; font-family:inherit; letter-spacing:.3px; position:relative; }
        .nav-btn:hover { color:#fff; background:rgba(0,245,212,0.08); }
        .nav-btn.active { color:#00f5d4; background:rgba(0,245,212,0.12); box-shadow:0 0 20px rgba(0,245,212,0.06); }
        .nav-btn.active::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:20px; height:2px; background:#00f5d4; border-radius:4px; box-shadow:0 0 12px #00f5d4; }
        .user-area { display:flex; align-items:center; gap:12px; }
        .btn-logout { padding:6px 18px; background:rgba(255,107,107,0.15); border:1px solid rgba(255,107,107,0.2); border-radius:20px; color:#ff6b6b; cursor:pointer; transition:.3s; font-family:inherit; font-size:.9rem; }
        .btn-logout:hover { background:rgba(255,107,107,0.25); }

        .main-container { flex:1; max-width:1200px; margin:0 auto; padding:2rem 1.5rem 3rem; width:100%; }

        .profile-wrapper { display:flex; gap:2rem; margin-top:.5rem; }
        .profile-sidebar {
            width:220px;
            flex-shrink:0;
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:20px;
            padding:1.5rem 0;
            height:fit-content;
        }
        .profile-sidebar .user-info { text-align:center; padding:0 1rem 1.2rem; border-bottom:1px solid rgba(255,255,255,0.04); }
        .profile-sidebar .user-info .avatar-large {
            width:72px; height:72px;
            border-radius:50%;
            background:linear-gradient(135deg,#00f5d4,#0077b6);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:2rem;
            font-weight:700;
            color:#0b0e14;
            margin:0 auto .6rem;
            background-size:cover;
            background-position:center;
        }
        .profile-sidebar .user-info .display-name { font-weight:600; font-size:1.1rem; }
        .profile-sidebar .user-info .user-email { font-size:.8rem; color:#5a738a; }
        .profile-sidebar .sidebar-menu { list-style:none; padding:.5rem 0; margin:0; }
        .profile-sidebar .sidebar-menu li {
            padding:.7rem 1.5rem;
            cursor:pointer;
            transition:.3s;
            color:#8aa3bc;
            font-size:.95rem;
            border-left:2px solid transparent;
        }
        .profile-sidebar .sidebar-menu li:hover { color:#e8edf5; background:rgba(255,255,255,0.03); }
        .profile-sidebar .sidebar-menu li.active { color:#00f5d4; border-left-color:#00f5d4; background:rgba(0,245,212,0.05); }
        .profile-content {
            flex:1;
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:20px;
            padding:2rem;
            min-height:400px;
        }
        .profile-content .panel { display:none; }
        .profile-content .panel.active { display:block; }
        .profile-content .panel h3 { color:#00f5d4; margin-bottom:1.2rem; font-size:1.3rem; }
        .profile-content .panel .field { margin-bottom:1.2rem; }
        .profile-content .panel .field label { display:block; font-size:.9rem; color:#8aa3bc; margin-bottom:4px; font-weight:500; }
        .profile-content .panel .field input,
        .profile-content .panel .field textarea {
            width:100%; padding:10px 14px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:12px;
            color:#e8edf5;
            font-size:.95rem;
            outline:none;
            transition:.3s;
            font-family:inherit;
            max-width:400px;
        }
        .profile-content .panel .field textarea { max-width:100%; min-height:80px; resize:vertical; }
        .profile-content .panel .field input:focus,
        .profile-content .panel .field textarea:focus {
            border-color:#00f5d4;
            box-shadow:0 0 0 3px rgba(0,245,212,0.08);
        }
        .profile-content .panel .btn {
            background:linear-gradient(135deg,#00f5d4,#0077b6);
            border:none;
            color:#0b0e14;
            font-weight:700;
            padding:10px 28px;
            border-radius:30px;
            cursor:pointer;
            font-size:.95rem;
            transition:.3s;
            font-family:inherit;
        }
        .profile-content .panel .btn:hover { transform:scale(1.02); box-shadow:0 8px 30px rgba(0,245,212,0.25); }
        .profile-content .panel .btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
        .log-item { padding:.6rem 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:.9rem; color:#b8ccdd; }
        .log-item .log-time { color:#5a738a; font-size:.8rem; }
        .log-item .log-action { color:#e8edf5; font-weight:500; }

        .footer { text-align:center; padding:2rem 1.5rem 1.5rem; border-top:1px solid rgba(255,255,255,0.04); color:#5a738a; font-size:.85rem; letter-spacing:.5px; background:rgba(13,18,28,0.6); backdrop-filter:blur(8px); }
        .footer span { color:#00f5d4; }
        .footer .admin-link { display:inline-block; margin-top:8px; color:#5a738a; font-size:.85rem; transition:.3s; border-bottom:1px dashed #5a738a; }
        .footer .admin-link:hover { color:#00f5d4; border-bottom-color:#00f5d4; }

        @media (max-width:820px) {
            .navbar { padding:0 1.2rem; height:64px; flex-wrap:wrap; }
            .logo { font-size:1.2rem; }
            .logo-icon { width:30px; height:30px; font-size:14px; }
            .nav-links { gap:2px; }
            .nav-btn { font-size:.8rem; padding:6px 12px; }
            .profile-wrapper { flex-direction:column; }
            .profile-sidebar { width:100%; }
            .profile-content { padding:1.2rem; }
        }
        @media (max-width:480px) {
            .navbar { padding:0 .8rem; height:58px; }
            .nav-btn { font-size:.7rem; padding:4px 8px; }
            .logo { font-size:1rem; }
            .logo-icon { width:26px; height:26px; font-size:12px; }
            .profile-content .panel .field input { max-width:100%; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="logo-icon">Z</span><span id="brandName">ZHDD 网安空间</span></div>
        <ul class="nav-links">
            <li><a href="index.html"><button class="nav-btn">首页</button></a></li>
            <li><a href="members.html"><button class="nav-btn">成员</button></a></li>
            <li><a href="about.html"><button class="nav-btn">简介</button></a></li>
            <li><a href="join.html"><button class="nav-btn">加入我们</button></a></li>
            <li><a href="articles.html"><button class="nav-btn">文章</button></a></li>
        </ul>
        <div class="user-area">
            <span id="userEmail" style="color:#8aa3bc;font-size:.9rem;display:none;"></span>
            <button class="btn-logout" id="logoutBtn" style="display:none;">退出</button>
        </div>
    </nav>

    <div class="main-container">
        <div class="profile-wrapper">
            <div class="profile-sidebar">
                <div class="user-info">
                    <div class="avatar-large" id="profileAvatar">U</div>
                    <div class="display-name" id="profileDisplayName">用户</div>
                    <div class="user-email" id="profileEmail">user@email.com</div>
                </div>
                <ul class="sidebar-menu">
                    <li class="active" data-panel="logs">📋 操作记录</li>
                    <li data-panel="settings">⚙️ 设置</li>
                    <li data-panel="articles">📝 我的文章</li>
                </ul>
            </div>
            <div class="profile-content">
                <!-- 操作记录 -->
                <div class="panel active" id="panel-logs">
                    <h3>📋 操作记录</h3>
                    <div id="logsContainer"><div style="color:#5a738a;text-align:center;padding:2rem;">加载中...</div></div>
                </div>
                <!-- 设置 -->
                <div class="panel" id="panel-settings">
                    <h3>⚙️ 设置</h3>
                    <div class="field"><label>显示名称</label><input type="text" id="settingsName" placeholder="输入新名称" /></div>
                    <button class="btn" id="saveNameBtn">💾 更新名称</button>
                    <div style="height:20px;"></div>
                    <div class="field"><label>个人简介</label><textarea id="settingsBio" placeholder="一句话介绍自己…" rows="3"></textarea></div>
                    <button class="btn" id="saveBioBtn">💾 更新简介</button>
                    <div style="height:20px;"></div>
                    <div class="field"><label>新密码</label><input type="password" id="settingsPassword" placeholder="至少6位" /></div>
                    <div class="field"><label>确认新密码</label><input type="password" id="settingsConfirmPassword" placeholder="再次输入" /></div>
                    <button class="btn" id="savePasswordBtn">🔒 更新密码</button>
                    <div id="settingsMessage" class="status-msg" style="margin-top:.8rem;font-size:.9rem;color:#8aa3bc;"></div>
                </div>
                <!-- 我的文章 -->
                <div class="panel" id="panel-articles">
                    <h3>📝 我的文章</h3>
                    <div id="myArticlesContainer"><div style="color:#5a738a;text-align:center;padding:2rem;">加载中...</div></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <span>&copy; 2026 ZHDD 网安空间 — 守护数字边界 · 铸就安全未来</span>
    </footer>

    <script src="utils.js"></script>
    <script>
        (function() {
            'use strict';

            // ---- 从 sessionStorage 获取当前用户 ----
            let currentUser = null;
            let currentUsername = null;
            let userProfile = null;

            function loadUser() {
                const stored = sessionStorage.getItem('currentUser');
                if (!stored) {
                    // 未登录，跳转到登录页
                    window.location.href = 'login.html';
                    return;
                }
                try {
                    currentUser = JSON.parse(stored);
                    currentUsername = currentUser.username;
                    // 渲染用户信息
                    document.getElementById('profileAvatar').textContent = (currentUser.display_name || currentUsername).charAt(0).toUpperCase();
                    document.getElementById('profileDisplayName').textContent = currentUser.display_name || currentUsername;
                    document.getElementById('profileEmail').textContent = currentUser.email || '';
                    document.getElementById('userEmail').textContent = currentUser.email || '';
                    document.getElementById('userEmail').style.display = 'inline';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    // 加载数据
                    loadProfileData();
                } catch (e) {
                    console.error('解析用户失败', e);
                    window.location.href = 'login.html';
                }
            }

            // ---- 加载个人数据 ----
            async function loadProfileData() {
                if (!currentUsername) return;
                await loadLogs();
                await loadMyArticles();
                await loadProfileSettings();
            }

            // ---- 加载操作记录 ----
            async function loadLogs() {
                const container = document.getElementById('logsContainer');
                container.innerHTML = '加载中...';
                try {
                    const ops = await loadUserFile(currentUsername, 'operations', []);
                    if (ops.length === 0) {
                        container.innerHTML = '<div style="color:#5a738a;text-align:center;padding:2rem;">暂无操作记录</div>';
                        return;
                    }
                    container.innerHTML = ops.map(op =>
                        `<div class="log-item"><span class="log-time">${new Date(op.created_at).toLocaleString()}</span><span class="log-action">${op.action}</span>${op.details ? ' · ' + op.details : ''}</div>`
                    ).join('');
                } catch (e) {
                    container.innerHTML = '<div style="color:#ff6b6b;text-align:center;padding:2rem;">加载失败</div>';
                }
            }

            // ---- 加载我的文章 ----
            async function loadMyArticles() {
                const container = document.getElementById('myArticlesContainer');
                container.innerHTML = '加载中...';
                try {
                    const articles = await loadUserFile(currentUsername, 'articles', []);
                    if (articles.length === 0) {
                        container.innerHTML = '<div style="color:#5a738a;text-align:center;padding:2rem;">暂无文章</div>';
                        return;
                    }
                    container.innerHTML = articles.map(a =>
                        `<div class="log-item"><span style="color:#e8edf5;font-weight:600;">${a.title}</span> <span style="color:#8aa3bc;font-size:.8rem;">${new Date(a.created_at).toLocaleDateString()}</span></div>`
                    ).join('');
                } catch (e) {
                    container.innerHTML = '<div style="color:#ff6b6b;text-align:center;padding:2rem;">加载失败</div>';
                }
            }

            // ---- 加载设置（填充表单） ----
            async function loadProfileSettings() {
                try {
                    const profile = await loadUserFile(currentUsername, 'profile', null);
                    if (profile) {
                        document.getElementById('settingsName').value = profile.display_name || currentUsername;
                        document.getElementById('settingsBio').value = profile.bio || '';
                    }
                } catch (e) {}
            }

            // ---- 侧边栏切换 ----
            document.querySelectorAll('.sidebar-menu li').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
                    this.classList.add('active');
                    const panel = this.dataset.panel;
                    document.querySelectorAll('.profile-content .panel').forEach(p => p.classList.remove('active'));
                    document.getElementById('panel-' + panel).classList.add('active');
                });
            });

            // ---- 退出登录 ----
            document.getElementById('logoutBtn').addEventListener('click', function() {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            });

            // ---- 更新名称 ----
            document.getElementById('saveNameBtn').addEventListener('click', async function() {
                const name = document.getElementById('settingsName').value.trim();
                const msg = document.getElementById('settingsMessage');
                if (!name) { msg.textContent = '⚠️ 请输入名称'; msg.style.color = '#ff6b6b'; return; }
                if (!currentUsername) { msg.textContent = '⚠️ 请先登录'; msg.style.color = '#ff6b6b'; return; }
                this.disabled = true;
                msg.textContent = '⏳ 更新中...';
                msg.style.color = '#8aa3bc';
                try {
                    const profile = await loadUserFile(currentUsername, 'profile', null);
                    if (!profile) throw new Error('用户资料不存在');
                    profile.display_name = name;
                    profile.updated_at = new Date().toISOString();
                    await saveUserFile(currentUsername, 'profile', profile, '更新显示名称');
                    // 更新 session 和 UI
                    currentUser.display_name = name;
                    sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
                    document.getElementById('profileDisplayName').textContent = name;
                    document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
                    // 记录操作
                    const ops = await loadUserFile(currentUsername, 'operations', []);
                    ops.push({ action: '更新名称', details: `修改为 ${name}`, created_at: new Date().toISOString() });
                    await saveUserFile(currentUsername, 'operations', ops, '记录操作');
                    msg.textContent = '✅ 名称更新成功！';
                    msg.style.color = '#00f5d4';
                } catch (err) {
                    msg.textContent = '❌ ' + err.message;
                    msg.style.color = '#ff6b6b';
                } finally { this.disabled = false; }
            });

            // ---- 更新简介 ----
            document.getElementById('saveBioBtn').addEventListener('click', async function() {
                const bio = document.getElementById('settingsBio').value.trim();
                const msg = document.getElementById('settingsMessage');
                if (!currentUsername) { msg.textContent = '⚠️ 请先登录'; msg.style.color = '#ff6b6b'; return; }
                this.disabled = true;
                msg.textContent = '⏳ 更新中...';
                msg.style.color = '#8aa3bc';
                try {
                    const profile = await loadUserFile(currentUsername, 'profile', null);
                    if (!profile) throw new Error('用户资料不存在');
                    profile.bio = bio;
                    profile.updated_at = new Date().toISOString();
                    await saveUserFile(currentUsername, 'profile', profile, '更新个人简介');
                    const ops = await loadUserFile(currentUsername, 'operations', []);
                    ops.push({ action: '更新简介', details: bio || '清空简介', created_at: new Date().toISOString() });
                    await saveUserFile(currentUsername, 'operations', ops, '记录操作');
                    msg.textContent = '✅ 简介更新成功！';
                    msg.style.color = '#00f5d4';
                } catch (err) {
                    msg.textContent = '❌ ' + err.message;
                    msg.style.color = '#ff6b6b';
                } finally { this.disabled = false; }
            });

            // ---- 更新密码 ----
            document.getElementById('savePasswordBtn').addEventListener('click', async function() {
                const pw = document.getElementById('settingsPassword').value.trim();
                const confirm = document.getElementById('settingsConfirmPassword').value.trim();
                const msg = document.getElementById('settingsMessage');
                if (!pw || !confirm) { msg.textContent = '⚠️ 请填写密码'; msg.style.color = '#ff6b6b'; return; }
                if (pw.length < 6) { msg.textContent = '⚠️ 密码至少6位'; msg.style.color = '#ff6b6b'; return; }
                if (pw !== confirm) { msg.textContent = '⚠️ 两次密码不一致'; msg.style.color = '#ff6b6b'; return; }
                if (!currentUsername) { msg.textContent = '⚠️ 请先登录'; msg.style.color = '#ff6b6b'; return; }
                this.disabled = true;
                msg.textContent = '⏳ 更新中...';
                msg.style.color = '#8aa3bc';
                try {
                    // 获取 salt，重新哈希
                    const creds = await loadUserFile(currentUsername, 'credentials', null);
                    if (!creds) throw new Error('凭证不存在');
                    const salt = creds.salt;
                    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw + salt));
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    const passwordHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                    creds.password_hash = passwordHash;
                    await saveUserFile(currentUsername, 'credentials', creds, '更新密码');
                    const ops = await loadUserFile(currentUsername, 'operations', []);
                    ops.push({ action: '更新密码', details: '密码已更改', created_at: new Date().toISOString() });
                    await saveUserFile(currentUsername, 'operations', ops, '记录操作');
                    msg.textContent = '✅ 密码更新成功！';
                    msg.style.color = '#00f5d4';
                    document.getElementById('settingsPassword').value = '';
                    document.getElementById('settingsConfirmPassword').value = '';
                } catch (err) {
                    msg.textContent = '❌ ' + err.message;
                    msg.style.color = '#ff6b6b';
                } finally { this.disabled = false; }
            });

            // ---- 启动 ----
            loadUser();
        })();
    </script>
</body>
</html>
