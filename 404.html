<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · ZHDD网安空间</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .container {
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 动态 404 ===== */
        .error-code {
            font-size: 10rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 8px;
            display: flex;
            justify-content: center;
            gap: 0.05em;
        }

        .error-code .digit {
            display: inline-block;
            background: linear-gradient(135deg, #00f5d4 0%, #48cae4 40%, #0077b6 70%, #7c3aed 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite, float 2.5s ease-in-out infinite;
        }

        /* 每个数字不同的延迟 */
        .error-code .digit:nth-child(1) {
            animation-delay: 0s, 0s;
        }
        .error-code .digit:nth-child(2) {
            animation-delay: 0.5s, 0.3s;
        }
        .error-code .digit:nth-child(3) {
            animation-delay: 1s, 0.6s;
        }

        /* 渐变流动 */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 上下浮动 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* 光晕脉冲（伪元素实现） */
        .error-code .digit {
            position: relative;
        }

        .error-code .digit::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 245, 212, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        .error-code .digit:nth-child(1)::after {
            animation-delay: 0s;
        }
        .error-code .digit:nth-child(2)::after {
            animation-delay: 0.6s;
        }
        .error-code .digit:nth-child(3)::after {
            animation-delay: 1.2s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        .sub {
            font-size: 1.2rem;
            color: #5a738a;
            margin-top: 0.5rem;
            letter-spacing: 2px;
            animation: fadeUp 0.8s ease 0.4s both;
        }

        .btn {
            display: inline-block;
            margin-top: 2.5rem;
            padding: 12px 40px;
            background: linear-gradient(135deg, #00f5d4, #0077b6);
            border: none;
            border-radius: 30px;
            color: #0b0e14;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0, 245, 212, 0.15);
            animation: fadeUp 0.8s ease 0.8s both;
        }

        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(0, 245, 212, 0.25);
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 5.5rem;
                letter-spacing: 4px;
            }
            .sub {
                font-size: 1rem;
            }
            .btn {
                padding: 10px 28px;
                font-size: 0.95rem;
            }
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background: #f0f4f8;
            }
            .sub {
                color: #8aa3bc;
            }
            .error-code .digit::after {
                background: radial-gradient(circle, rgba(0, 119, 182, 0.08) 0%, transparent 70%);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">
            <span class="digit">4</span>
            <span class="digit">0</span>
            <span class="digit">4</span>
        </div>
        <div class="sub">哎呀，真不巧，页面走丢了。</div>
        <a href="https://zhdd.bbroot.com" class="btn">🏠 返回主页</a>
    </div>

</body>
</html>
