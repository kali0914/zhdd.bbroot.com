<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · ZHDD网安空间</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;
            background:#0b0e14; color:#e8edf5;
            min-height:100vh; display:flex; flex-direction:column;
        }
        a { text-decoration:none; color:inherit; }

        .navbar {
            background:rgba(13,18,28,0.92);
            backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(0,255,200,0.15);
            padding:0 2rem;
            height:72px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 4px 30px rgba(0,0,0,0.5);
        }
        .logo { display:flex; align-items:center; gap:10px; font-size:1.5rem; font-weight:700; letter-spacing:1px; color:#00f5d4; text-shadow:0 0 20px rgba(0,245,212,0.2); }
        .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,#00f5d4,#0077b6); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#0b0e14; box-shadow:0 0 20px rgba(0,245,212,0.25); }
        .nav-links { display:flex; gap:4px; list-style:none; align-items:center; }
        .nav-links li { display:inline; }
        .nav-btn { background:transparent; border:none; color:#a0b4c8; font-size:1rem; font-weight:500; padding:8px 18px; border-radius:30px; cursor:pointer; transition:all .25s ease; font-family:inherit; letter-spacing:.3px; position:relative; }
        .nav-btn:hover { color:#fff; background:rgba(0,245,212,0.08); }
        .nav-btn.active { color:#00f5d4; background:rgba(0,245,212,0.12); box-shadow:0 0 20px rgba(0,245,212,0.06); }
        .nav-btn.active::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:20px; height:2px; background:#00f5d4; border-radius:4px; box-shadow:0 0 12px #00f5d4; }
        .user-area { display:flex; align-items:center; gap:12px; }
        .btn-logout { padding:6px 18px; background:rgba(255,107,107,0.15); border:1px solid rgba(255,107,107,0.2); border-radius:20px; color:#ff6b6b; cursor:pointer; transition:.3s; font-family:inherit; font-size:.9rem; }
        .btn-logout:hover { background:rgba(255,107,107,0.25); }

        .main-container { flex:1; max-width:1200px; margin:0 auto; padding:2rem 1.5rem 3rem; width:100%; }

        /* 登录页 */
        .login-box { max-width:400px; margin:3rem auto; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:2.5rem 2rem; text-align:center; }
        .login-box h2 { color:#00f5d4; margin-bottom:.5rem; }
        .login-box .sub { color:#8aa3bc; margin-bottom:1.5rem; }
        .login-box input { width:100%; padding:12px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:14px; color:#e8edf5; font-size:1rem; margin-bottom:1rem; outline:none; }
        .login-box input:focus { border-color:#00f5d4; }
        .login-box .btn { width:100%; padding:12px; background:linear-gradient(135deg,#00f5d4,#0077b6); border:none; border-radius:30px; color:#0b0e14; font-weight:700; font-size:1rem; cursor:pointer; transition:.3s; }
        .login-box .btn:hover { transform:scale(1.02); box-shadow:0 8px 30px rgba(0,245,212,0.25); }
        .login-box .error { color:#ff6b6b; margin-top:.5rem; display:none; }

        /* 面板 */
        .panel { display:none; }
        .panel.active { display:block; }
        .tab-bar { display:flex; gap:.5rem; margin-bottom:1.5rem; border-bottom:1px solid rgba(255,255,255,0.06); padding-bottom:.5rem; flex-wrap:wrap; }
        .tab-btn { background:transparent; border:none; color:#8aa3bc; padding:8px 20px; border-radius:20px; cursor:pointer; font-size:.95rem; transition:.3s; font-family:inherit; }
        .tab-btn.active { background:rgba(0,245,212,0.12); color:#00f5d4; }
        .tab-btn:hover { color:#e8edf5; }

        .card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:1.5rem; margin-bottom:1.5rem; }
        .card h3 { color:#00f5d4; margin-bottom:1rem; font-size:1.2rem; }
        .card .field { margin-bottom:.8rem; }
        .card .field label { display:block; color:#8aa3bc; font-size:.9rem; margin-bottom:4px; }
        .card .field input,.card .field textarea,.card .field select {
            width:100%; padding:8px 12px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;
            color:#e8edf5;
            font-size:.95rem;
            font-family:inherit;
            outline:none;
            transition:.3s;
        }
        .card .field input:focus,.card .field textarea:focus,.card .field select:focus {
            border-color:#00f5d4;
            box-shadow:0 0 0 3px rgba(0,245,212,0.08);
        }
        .card .field textarea { min-height:60px; resize:vertical; }
        .card .field select option { background:#0b0e14; }

        .btn { background:linear-gradient(135deg,#00f5d4,#0077b6); border:none; color:#0b0e14; font-weight:700; padding:8px 20px; border-radius:30px; cursor:pointer; font-size:.9rem; transition:.3s; font-family:inherit; }
        .btn:hover { transform:scale(1.02); box-shadow:0 8px 30px rgba(0,245,212,0.25); }
        .btn-danger { background:#ef4444; color:#fff; }
        .btn-danger:hover { background:#dc2626; }
        .btn-sm { padding:4px 12px; font-size:.8rem; }
        .btn-success { background:#22c55e; color:#fff; }
        .btn-success:hover { background:#16a34a; }
        .btn-warning { background:#f59e0b; color:#fff; }
        .btn-warning:hover { background:#d97706; }

        .item-list { margin-top:.5rem; }
        .item-list .item { display:flex; align-items:center; justify-content:space-between; padding:.6rem 0; border-bottom:1px solid rgba(255,255,255,0.04); gap:.5rem; flex-wrap:wrap; }
        .item-list .item:last-child { border-bottom:none; }
        .item-list .item .info { flex:1; min-width:150px; }
        .item-list .item .info .title { font-weight:600; }
        .item-list .item .info .meta { font-size:.8rem; color:#8aa3bc; }
        .item-list .item .actions { display:flex; gap:4px; flex-wrap:wrap; }

        .status-msg { margin-top:.5rem; font-size:.9rem; color:#8aa3bc; }
        .status-msg.success { color:#00f5d4; }
        .status-msg.error { color:#ff6b6b; }

        .footer { text-align:center; padding:1.5rem; border-top:1px solid rgba(255,255,255,0.04); color:#5a738a; font-size:.85rem; }
        .footer span { color:#00f5d4; }

        /* 模态框 */
        .modal-overlay {
            display:none;
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(4px);
            z-index:1000;
            align-items:center;
            justify-content:center;
        }
        .modal-overlay.active { display:flex; }
        .modal-box {
            background:#1a202a;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:24px;
            padding:2rem;
            max-width:700px;
            width:90%;
            max-height:90vh;
            overflow-y:auto;
        }
        .modal-box h3 { color:#00f5d4; margin-bottom:1rem; }
        .modal-box .field { margin-bottom:1rem; }
        .modal-box .btn-group { display:flex; gap:10px; justify-content:flex-end; margin-top:1rem; }

        @media (max-width:700px) {
            .navbar { padding:0 1rem; height:60px; }
            .nav-btn { font-size:.8rem; padding:6px 12px; }
            .tab-bar { gap:.3rem; }
            .tab-btn { font-size:.8rem; padding:6px 12px; }
            .modal-box { padding:1.2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><span class="logo-icon">Z</span><span id="brandName">ZHDD 管理</span></div>
        <ul class="nav-links">
            <li><a href="index.html"><button class="nav-btn">返回网站</button></a></li>
        </ul>
        <div class="user-area">
            <span id="adminUser" style="color:#8aa3bc;font-size:.9rem;display:none;"></span>
            <button class="btn-logout" id="logoutBtn" style="display:none;">退出</button>
        </div>
    </nav>

    <div class="main-container">

        <!-- 登录页 -->
        <div id="loginPage" class="login-box">
            <h2>🔐 管理后台</h2>
            <p class="sub">请输入超管账号密码</p>
            <input type="text" id="adminEmail" placeholder="邮箱" value="kali0914@yeah.net" />
            <input type="password" id="adminPassword" placeholder="密码" />
            <button class="btn" id="loginBtn">登录</button>
            <div class="error" id="loginError">❌ 账号或密码错误</div>
        </div>

        <!-- 管理面板 -->
        <div id="adminPanel" style="display:none;">
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="tabUsers">👤 用户</button>
                <button class="tab-btn" data-tab="tabArticles">📝 文章</button>
                <button class="tab-btn" data-tab="tabJoins">📩 申请</button>
                <button class="tab-btn" data-tab="tabConfig">⚙️ 配置</button>
                <button class="tab-btn" data-tab="tabTemplates">📧 模板</button>
                <button class="tab-btn" data-tab="tabFriends">🔗 友链</button>
            </div>

            <!-- 用户管理 -->
            <div id="tabUsers" class="panel active">
                <div class="card"><h3>👤 用户管理</h3><div id="userList" class="item-list">加载中...</div></div>
            </div>

            <!-- 文章管理 -->
            <div id="tabArticles" class="panel">
                <div class="card"><h3>📝 所有文章</h3><div id="articleList" class="item-list">加载中...</div></div>
            </div>

            <!-- 加入申请 -->
            <div id="tabJoins" class="panel">
                <div class="card"><h3>📩 加入申请</h3><div id="joinList" class="item-list">加载中...</div></div>
            </div>

            <!-- 网站配置 -->
            <div id="tabConfig" class="panel">
                <div class="card">
                    <h3>⚙️ 网站配置</h3>
                    <form id="configForm">
                        <div class="field"><label>站点名称</label><input type="text" id="cfg_site_name" /></div>
                        <div class="field"><label>公告内容</label><input type="text" id="cfg_announcement" /></div>
                        <div class="field"><label>首页标题</label><input type="text" id="cfg_home_title" /></div>
                        <div class="field"><label>首页副标题</label><input type="text" id="cfg_home_subtitle" /></div>
                        <div class="field"><label>首页描述 (HTML)</label><textarea id="cfg_home_desc" rows="3"></textarea></div>
                        <div class="field"><label>首页徽章 (JSON)</label><textarea id="cfg_home_badges" rows="3">[{"number":"7×24","label":"应急响应"},{"number":"100+","label":"服务客户"},{"number":"99.9%","label":"威胁拦截率"}]</textarea></div>
                        <div class="field"><label>成员页面标题</label><input type="text" id="cfg_members_title" /></div>
                        <div class="field"><label>成员列表 (JSON)</label><textarea id="cfg_members_list" rows="5">[{"name":"成员一","role":"安全架构师","desc":"暂无介绍…","avatar":""}]</textarea></div>
                        <div class="field"><label>关于页面标题</label><input type="text" id="cfg_about_title" /></div>
                        <div class="field"><label>关于页面副标题</label><input type="text" id="cfg_about_subtitle" /></div>
                        <div class="field"><label>使命 (HTML)</label><textarea id="cfg_about_mission" rows="3"></textarea></div>
                        <div class="field"><label>核心能力 (JSON数组)</label><textarea id="cfg_about_abilities" rows="3">["渗透测试 & 红蓝对抗","安全运营 & 态势感知"]</textarea></div>
                        <div class="field"><label>价值观 (HTML)</label><textarea id="cfg_about_values" rows="3"></textarea></div>
                        <div class="field"><label>加入我们标题</label><input type="text" id="cfg_join_title" /></div>
                        <div class="field"><label>加入我们副标题</label><input type="text" id="cfg_join_subtitle" /></div>
                        <div class="field"><label>加入我们介绍</label><textarea id="cfg_join_info" rows="3"></textarea></div>
                        <div class="field"><label>加入表单标题</label><input type="text" id="cfg_join_form_title" /></div>
                        <div class="field"><label>文章列表标题</label><input type="text" id="cfg_articles_title" /></div>
                        <div class="field"><label>页脚版权</label><input type="text" id="cfg_footer_copyright" /></div>
                        <button type="button" class="btn" id="saveConfigBtn">💾 保存配置</button>
                        <div id="configStatus" class="status-msg"></div>
                    </form>
                </div>
            </div>

            <!-- 邮件模板 -->
            <div id="tabTemplates" class="panel">
                <div class="card"><h3>📧 邮件模板</h3><div id="templateList" class="item-list">加载中...</div></div>
            </div>

            <!-- 友链 -->
            <div id="tabFriends" class="panel">
                <div class="card">
                    <h3>🔗 友链管理</h3>
                    <div class="field"><label>添加友链 (格式: 名称|URL)</label><input type="text" id="newFriend" placeholder="ZHDD|https://zhdd.bbroot.com" /></div>
                    <button class="btn" id="addFriendBtn">添加</button>
                    <div id="friendList" class="item-list" style="margin-top:1rem;">加载中...</div>
                </div>
            </div>

        </div>

    </div>

    <footer class="footer"><span>ZHDD 网安空间</span> · 管理后台</footer>

    <!-- 编辑模态框 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h3 id="editModalTitle">编辑</h3>
            <div id="editModalBody"></div>
            <div class="btn-group">
                <button class="btn btn-sm" id="editModalCancel">取消</button>
                <button class="btn btn-sm btn-success" id="editModalSave">保存</button>
            </div>
            <div id="editModalStatus" class="status-msg"></div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  超管配置
            // ============================================================
            const ADMIN_EMAIL = 'kali0914@yeah.net';
            const DEFAULT_ADMIN_PASS = 'admin123';
            const ADMIN_FILE = 'data/admin.zhdd';

            emailjs.init(EMAILJS_PUBLIC_KEY);

            // ============================================================
            //  DOM 引用
            // ============================================================
            const loginPage = document.getElementById('loginPage');
            const adminPanel = document.getElementById('adminPanel');
            const adminEmail = document.getElementById('adminEmail');
            const adminPassword = document.getElementById('adminPassword');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const logoutBtn = document.getElementById('logoutBtn');
            const adminUser = document.getElementById('adminUser');

            const tabBtns = document.querySelectorAll('.tab-btn');
            const panels = {
                tabUsers: document.getElementById('tabUsers'),
                tabArticles: document.getElementById('tabArticles'),
                tabJoins: document.getElementById('tabJoins'),
                tabConfig: document.getElementById('tabConfig'),
                tabTemplates: document.getElementById('tabTemplates'),
                tabFriends: document.getElementById('tabFriends'),
            };

            // ============================================================
            //  超管登录
            // ============================================================
            async function verifyAdmin(email, password) {
                let adminData = await loadZhddFile(ADMIN_FILE, null);
                if (!adminData) {
                    const salt = Math.random().toString(36).substring(2, 15);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(DEFAULT_ADMIN_PASS + salt));
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    const passwordHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                    adminData = { email: ADMIN_EMAIL, password_hash: passwordHash, salt: salt, created_at: new Date().toISOString() };
                    await saveZhddFile(ADMIN_FILE, adminData, '初始化超管账号');
                }
                if (email !== adminData.email) return false;
                const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password + adminData.salt));
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const inputHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                return inputHash === adminData.password_hash;
            }

            loginBtn.addEventListener('click', async function() {
                const email = adminEmail.value.trim();
                const password = adminPassword.value.trim();
                if (!email || !password) { loginError.style.display = 'block';
                    loginError.textContent = '❌ 请填写完整'; return; }
                loginError.style.display = 'none';
                this.disabled = true;
                this.textContent = '⏳ 验证中...';
                try {
                    const ok = await verifyAdmin(email, password);
                    if (ok) {
                        sessionStorage.setItem('admin_logged_in', 'true');
                        sessionStorage.setItem('admin_email', email);
                        showAdminPanel(email);
                    } else {
                        loginError.style.display = 'block';
                        loginError.textContent = '❌ 账号或密码错误';
                    }
                } catch (e) {
                    loginError.style.display = 'block';
                    loginError.textContent = '❌ ' + e.message;
                } finally {
                    this.disabled = false;
                    this.textContent = '登录';
                }
            });

            function showAdminPanel(email) {
                loginPage.style.display = 'none';
                adminPanel.style.display = 'block';
                adminUser.style.display = 'inline';
                adminUser.textContent = '👤 ' + email;
                logoutBtn.style.display = 'inline-block';
                loadUsers();
                loadAllArticles();
                loadJoins();
                loadConfig();
                loadTemplates();
                loadFriends();
            }

            logoutBtn.addEventListener('click', function() {
                sessionStorage.removeItem('admin_logged_in');
                sessionStorage.removeItem('admin_email');
                loginPage.style.display = 'block';
                adminPanel.style.display = 'none';
                adminUser.style.display = 'none';
                logoutBtn.style.display = 'none';
                loginError.style.display = 'none';
                adminPassword.value = '';
            });

            // ============================================================
            //  Tab 切换
            // ============================================================
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tabId = this.dataset.tab;
                    Object.keys(panels).forEach(key => {
                        panels[key].classList.toggle('active', key === tabId);
                    });
                    if (tabId === 'tabUsers') loadUsers();
                    if (tabId === 'tabArticles') loadAllArticles();
                    if (tabId === 'tabJoins') loadJoins();
                    if (tabId === 'tabConfig') loadConfig();
                    if (tabId === 'tabTemplates') loadTemplates();
                    if (tabId === 'tabFriends') loadFriends();
                });
            });

            // ============================================================
            //  工具 - 获取所有用户
            // ============================================================
            async function getAllUsers() {
                const dir = 'data/users';
                const url = `${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(dir)}`;
                const res = await fetch(url);
                if (!res.ok) return [];
                const data = await res.json();
                const users = [];
                if (Array.isArray(data)) {
                    for (const item of data) {
                        if (item.type === 'dir') {
                            const profile = await loadUserFile(item.name, 'profile', null);
                            if (profile) {
                                users.push({ username: item.name, profile: profile });
                            }
                        }
                    }
                }
                return users;
            }

            // ============================================================
            //  用户管理
            // ============================================================
            async function loadUsers() {
                const container = document.getElementById('userList');
                container.innerHTML = '加载中...';
                try {
                    const users = await getAllUsers();
                    if (users.length === 0) { container.innerHTML = '暂无用户'; return; }
                    let html = '';
                    for (const u of users) {
                        const profile = u.profile;
                        html += `<div class="item" data-username="${u.username}">
                            <div class="info">
                                <div class="title">${profile.display_name || u.username}</div>
                                <div class="meta">${profile.email} · 角色: ${profile.role || 'member'} · 成员: ${profile.is_member ? '✅' : '❌'}</div>
                            </div>
                            <div class="actions">
                                <button class="btn btn-sm btn-edit-user" data-username="${u.username}">编辑</button>
                                <button class="btn btn-sm btn-danger btn-del-user" data-username="${u.username}">删除</button>
                            </div>
                        </div>`;
                    }
                    container.innerHTML = html;
                    container.querySelectorAll('.btn-edit-user').forEach(btn => {
                        btn.addEventListener('click', function() { openEditUser(this.dataset.username); });
                    });
                    container.querySelectorAll('.btn-del-user').forEach(btn => {
                        btn.addEventListener('click', function() {
                            if (confirm('确定要删除用户 "' + this.dataset.username + '" 及其所有数据吗？')) {
                                deleteUser(this.dataset.username);
                            }
                        });
                    });
                } catch (e) {
                    container.innerHTML = '加载失败: ' + e.message;
                }
            }

            async function openEditUser(username) {
                const profile = await loadUserFile(username, 'profile', null);
                if (!profile) { alert('用户不存在'); return; }
                const modal = document.getElementById('editModal');
                const body = document.getElementById('editModalBody');
                document.getElementById('editModalTitle').textContent = '编辑用户: ' + username;
                body.innerHTML = `
                    <div class="field"><label>显示名称</label><input type="text" id="editUserDisplay" value="${profile.display_name || ''}" /></div>
                    <div class="field"><label>邮箱</label><input type="email" id="editUserEmail" value="${profile.email || ''}" /></div>
                    <div class="field"><label>角色</label>
                        <select id="editUserRole"><option value="member" ${profile.role === 'member' ? 'selected' : ''}>member</option><option value="admin" ${profile.role === 'admin' ? 'selected' : ''}>admin</option></select>
                    </div>
                    <div class="field"><label>成员状态</label>
                        <select id="editUserMember"><option value="true" ${profile.is_member ? 'selected' : ''}>正式成员</option><option value="false" ${!profile.is_member ? 'selected' : ''}>非成员</option></select>
                    </div>
                    <div class="field"><label>个人简介</label><textarea id="editUserBio" rows="3">${profile.bio || ''}</textarea></div>
                    <div class="field"><label>头像 URL</label><input type="url" id="editUserAvatar" value="${profile.avatar_url || ''}" /></div>
                `;
                modal.classList.add('active');
                document.getElementById('editModalSave').onclick = async function() {
                    const newDisplay = document.getElementById('editUserDisplay').value.trim();
                    const newEmail = document.getElementById('editUserEmail').value.trim();
                    const newRole = document.getElementById('editUserRole').value;
                    const newMember = document.getElementById('editUserMember').value === 'true';
                    const newBio = document.getElementById('editUserBio').value.trim();
                    const newAvatar = document.getElementById('editUserAvatar').value.trim();
                    if (!newDisplay || !newEmail) { alert('显示名称和邮箱不能为空'); return; }
                    try {
                        profile.display_name = newDisplay;
                        profile.email = newEmail;
                        profile.role = newRole;
                        profile.is_member = newMember;
                        profile.bio = newBio;
                        profile.avatar_url = newAvatar;
                        profile.updated_at = new Date().toISOString();
                        await saveUserFile(username, 'profile', profile, '管理员更新用户资料');
                        alert('更新成功');
                        modal.classList.remove('active');
                        loadUsers();
                    } catch (e) { alert('保存失败: ' + e.message); }
                };
                document.getElementById('editModalCancel').onclick = function() { modal.classList.remove('active'); };
            }

            async function deleteUser(username) {
                try {
                    const profile = await loadUserFile(username, 'profile', null);
                    if (profile) {
                        profile.deleted = true;
                        await saveUserFile(username, 'profile', profile, '管理员删除用户');
                    }
                    loadUsers();
                } catch (e) { alert('删除失败: ' + e.message); }
            }

            // ============================================================
            //  文章管理
            // ============================================================
            async function loadAllArticles() {
                const container = document.getElementById('articleList');
                container.innerHTML = '加载中...';
                try {
                    const users = await getAllUsers();
                    let allArticles = [];
                    for (const u of users) {
                        const articles = await loadUserFile(u.username, 'articles', []);
                        for (const a of articles) {
                            a._username = u.username;
                            allArticles.push(a);
                        }
                    }
                    if (allArticles.length === 0) { container.innerHTML = '暂无文章'; return; }
                    let html = '';
                    for (const a of allArticles) {
                        html += `<div class="item" data-id="${a.id}">
                            <div class="info">
                                <div class="title">${a.title || '无标题'}</div>
                                <div class="meta">作者: ${a._username} · ${new Date(a.created_at).toLocaleDateString()}</div>
                            </div>
                            <div class="actions">
                                <button class="btn btn-sm btn-edit-article" data-username="${a._username}" data-id="${a.id}">编辑</button>
                                <button class="btn btn-sm btn-danger btn-del-article" data-username="${a._username}" data-id="${a.id}">删除</button>
                            </div>
                        </div>`;
                    }
                    container.innerHTML = html;
                    container.querySelectorAll('.btn-edit-article').forEach(btn => {
                        btn.addEventListener('click', function() { openEditArticle(this.dataset.username, this.dataset.id); });
                    });
                    container.querySelectorAll('.btn-del-article').forEach(btn => {
                        btn.addEventListener('click', function() {
                            if (confirm('确定删除该文章？')) {
                                deleteArticle(this.dataset.username, this.dataset.id);
                            }
                        });
                    });
                } catch (e) {
                    container.innerHTML = '加载失败: ' + e.message;
                }
            }

            async function openEditArticle(username, id) {
                const articles = await loadUserFile(username, 'articles', []);
                const article = articles.find(a => a.id === id);
                if (!article) { alert('文章不存在'); return; }
                const modal = document.getElementById('editModal');
                const body = document.getElementById('editModalBody');
                document.getElementById('editModalTitle').textContent = '编辑文章 (作者: ' + username + ')';
                body.innerHTML = `
                    <div class="field"><label>标题</label><input type="text" id="editArticleTitle" value="${article.title || ''}" /></div>
                    <div class="field"><label>内容</label><textarea id="editArticleContent" rows="8">${article.content || ''}</textarea></div>
                `;
                modal.classList.add('active');
                document.getElementById('editModalSave').onclick = async function() {
                    const title = document.getElementById('editArticleTitle').value.trim();
                    const content = document.getElementById('editArticleContent').value.trim();
                    if (!title) { alert('标题不能为空'); return; }
                    article.title = title;
                    article.content = content;
                    article.updated_at = new Date().toISOString();
                    try {
                        await saveUserFile(username, 'articles', articles, '管理员编辑文章');
                        alert('更新成功');
                        modal.classList.remove('active');
                        loadAllArticles();
                    } catch (e) { alert('保存失败: ' + e.message); }
                };
                document.getElementById('editModalCancel').onclick = function() { modal.classList.remove('active'); };
            }

            async function deleteArticle(username, id) {
                const articles = await loadUserFile(username, 'articles', []);
                const idx = articles.findIndex(a => a.id === id);
                if (idx === -1) return;
                articles.splice(idx, 1);
                await saveUserFile(username, 'articles', articles, '管理员删除文章');
                loadAllArticles();
            }

            // ============================================================
            //  加入申请管理
            // ============================================================
            async function loadJoins() {
                const container = document.getElementById('joinList');
                container.innerHTML = '加载中...';
                try {
                    const requests = await loadZhddFile('data/join_requests.zhdd', []);
                    if (requests.length === 0) { container.innerHTML = '暂无申请'; return; }
                    let html = '';
                    const statusMap = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };
                    for (const r of requests) {
                        html += `<div class="item" data-id="${r.id}">
                            <div class="info">
                                <div class="title">${r.name}</div>
                                <div class="meta">${r.email} · 状态: ${statusMap[r.status] || r.status}</div>
                            </div>
                            <div class="actions">
                                ${r.status === 'pending' ? `<button class="btn btn-sm btn-success btn-approve" data-id="${r.id}">批准</button><button class="btn btn-sm btn-danger btn-reject" data-id="${r.id}">拒绝</button>` : ''}
                            </div>
                        </div>`;
                    }
                    container.innerHTML = html;
                    container.querySelectorAll('.btn-approve').forEach(btn => {
                        btn.addEventListener('click', function() { approveJoin(this.dataset.id); });
                    });
                    container.querySelectorAll('.btn-reject').forEach(btn => {
                        btn.addEventListener('click', function() { rejectJoin(this.dataset.id); });
                    });
                } catch (e) {
                    container.innerHTML = '加载失败: ' + e.message;
                }
            }

            async function approveJoin(id) {
                const requests = await loadZhddFile('data/join_requests.zhdd', []);
                const req = requests.find(r => r.id === id);
                if (!req) return;
                req.status = 'approved';
                await saveZhddFile('data/join_requests.zhdd', requests, '批准加入申请');
                const profile = await loadUserFile(req.username, 'profile', null);
                if (profile) {
                    profile.is_member = true;
                    await saveUserFile(req.username, 'profile', profile, '管理员批准加入');
                }
                try {
                    const raw = await fetchEmailTemplate('join_approved');
                    const htmlContent = renderTemplate(raw, { name: req.name });
                    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                        to_email: req.email,
                        htmlContent: htmlContent
                    });
                } catch (e) { console.warn('邮件发送失败', e); }
                loadJoins();
            }

            async function rejectJoin(id) {
                const requests = await loadZhddFile('data/join_requests.zhdd', []);
                const req = requests.find(r => r.id === id);
                if (!req) return;
                req.status = 'rejected';
                await saveZhddFile('data/join_requests.zhdd', requests, '拒绝加入申请');
                loadJoins();
            }

            // ============================================================
            //  网站配置管理
            // ============================================================
            let currentConfig = null;

            async function loadConfig() {
                try {
                    const config = await loadSiteConfig();
                    currentConfig = config;
                    if (!config) return;
                    document.getElementById('cfg_site_name').value = config.site_name || '';
                    document.getElementById('cfg_announcement').value = config.announcement?.content || '';
                    document.getElementById('cfg_home_title').value = config.home?.title || '';
                    document.getElementById('cfg_home_subtitle').value = config.home?.subtitle || '';
                    document.getElementById('cfg_home_desc').value = config.home?.description || '';
                    document.getElementById('cfg_home_badges').value = JSON.stringify(config.home?.badges || [], null, 2);
                    document.getElementById('cfg_members_title').value = config.members?.title || '';
                    document.getElementById('cfg_members_list').value = JSON.stringify(config.members?.list || [], null, 2);
                    document.getElementById('cfg_about_title').value = config.about?.title || '';
                    document.getElementById('cfg_about_subtitle').value = config.about?.subtitle || '';
                    document.getElementById('cfg_about_mission').value = config.about?.mission || '';
                    document.getElementById('cfg_about_abilities').value = JSON.stringify(config.about?.abilities || [], null, 2);
                    document.getElementById('cfg_about_values').value = config.about?.values || '';
                    document.getElementById('cfg_join_title').value = config.join?.title || '';
                    document.getElementById('cfg_join_subtitle').value = config.join?.subtitle || '';
                    document.getElementById('cfg_join_info').value = config.join?.info_content || '';
                    document.getElementById('cfg_join_form_title').value = config.join?.form_title || '';
                    document.getElementById('cfg_articles_title').value = config.articles?.title || '';
                    document.getElementById('cfg_footer_copyright').value = config.footer?.copyright || '';
                } catch (e) {
                    console.warn('加载配置失败', e);
                }
            }

            document.getElementById('saveConfigBtn').addEventListener('click', async function() {
                const status = document.getElementById('configStatus');
                status.textContent = '⏳ 保存中...';
                status.className = 'status-msg';
                this.disabled = true;
                try {
                    const newConfig = {
                        site_name: document.getElementById('cfg_site_name').value.trim(),
                        announcement: { content: document.getElementById('cfg_announcement').value.trim() },
                        home: {
                            title: document.getElementById('cfg_home_title').value.trim(),
                            subtitle: document.getElementById('cfg_home_subtitle').value.trim(),
                            description: document.getElementById('cfg_home_desc').value.trim(),
                            badges: JSON.parse(document.getElementById('cfg_home_badges').value || '[]')
                        },
                        members: {
                            title: document.getElementById('cfg_members_title').value.trim(),
                            list: JSON.parse(document.getElementById('cfg_members_list').value || '[]')
                        },
                        about: {
                            title: document.getElementById('cfg_about_title').value.trim(),
                            subtitle: document.getElementById('cfg_about_subtitle').value.trim(),
                            mission: document.getElementById('cfg_about_mission').value.trim(),
                            abilities: JSON.parse(document.getElementById('cfg_about_abilities').value || '[]'),
                            values: document.getElementById('cfg_about_values').value.trim()
                        },
                        join: {
                            title: document.getElementById('cfg_join_title').value.trim(),
                            subtitle: document.getElementById('cfg_join_subtitle').value.trim(),
                            info_content: document.getElementById('cfg_join_info').value.trim(),
                            form_title: document.getElementById('cfg_join_form_title').value.trim()
                        },
                        articles: {
                            title: document.getElementById('cfg_articles_title').value.trim()
                        },
                        footer: {
                            copyright: document.getElementById('cfg_footer_copyright').value.trim()
                        }
                    };
                    const old = await loadSiteConfig();
                    if (old) { newConfig.nav = old.nav || {};
                        newConfig.auth = old.auth || {}; }
                    const content = JSON.stringify(newConfig, null, 2);
                    await gitcodePutFile('data/site_config.json', utf8ToBase64(content), '管理员更新网站配置');
                    status.textContent = '✅ 保存成功！';
                    status.className = 'status-msg success';
                } catch (e) {
                    status.textContent = '❌ ' + e.message;
                    status.className = 'status-msg error';
                } finally {
                    this.disabled = false;
                }
            });

            // ============================================================
            //  邮件模板管理
            // ============================================================
            async function loadTemplates() {
                const container = document.getElementById('templateList');
                container.innerHTML = '加载中...';
                try {
                    const templates = ['register_code', 'reset_password', 'join_notify', 'join_approved'];
                    let html = '';
                    for (const t of templates) {
                        html += `<div class="item" data-template="${t}">
                            <div class="info"><div class="title">${t}.html</div></div>
                            <div class="actions"><button class="btn btn-sm btn-edit-template" data-template="${t}">编辑</button></div>
                        </div>`;
                    }
                    container.innerHTML = html;
                    container.querySelectorAll('.btn-edit-template').forEach(btn => {
                        btn.addEventListener('click', function() { openEditTemplate(this.dataset.template); });
                    });
                } catch (e) {
                    container.innerHTML = '加载失败: ' + e.message;
                }
            }

            async function openEditTemplate(template) {
                const content = await fetchEmailTemplate(template);
                const modal = document.getElementById('editModal');
                const body = document.getElementById('editModalBody');
                document.getElementById('editModalTitle').textContent = '编辑模板: ' + template + '.html';
                body.innerHTML = `<div class="field"><label>HTML 内容</label><textarea id="editTemplateContent" rows="15">${content}</textarea></div>`;
                modal.classList.add('active');
                document.getElementById('editModalSave').onclick = async function() {
                    const newContent = document.getElementById('editTemplateContent').value;
                    try {
                        const path = 'data/email_templates/' + template + '.html';
                        await gitcodePutFile(path, utf8ToBase64(newContent), '管理员更新模板 ' + template);
                        alert('保存成功');
                        modal.classList.remove('active');
                        loadTemplates();
                    } catch (e) { alert('保存失败: ' + e.message); }
                };
                document.getElementById('editModalCancel').onclick = function() { modal.classList.remove('active'); };
            }

            // ============================================================
            //  友链管理
            // ============================================================
            async function loadFriends() {
                const container = document.getElementById('friendList');
                container.innerHTML = '加载中...';
                try {
                    const friends = await loadZhddFile('data/friends.zhdd', []);
                    if (friends.length === 0) { container.innerHTML = '暂无友链'; return; }
                    let html = '';
                    for (const f of friends) {
                        html += `<div class="item" data-id="${f.id}">
                            <div class="info"><div class="title">${f.name}</div><div class="meta">${f.url}</div></div>
                            <div class="actions"><button class="btn btn-sm btn-danger btn-del-friend" data-id="${f.id}">删除</button></div>
                        </div>`;
                    }
                    container.innerHTML = html;
                    container.querySelectorAll('.btn-del-friend').forEach(btn => {
                        btn.addEventListener('click', function() { deleteFriend(this.dataset.id); });
                    });
                } catch (e) {
                    container.innerHTML = '加载失败: ' + e.message;
                }
            }

            document.getElementById('addFriendBtn').addEventListener('click', async function() {
                const input = document.getElementById('newFriend');
                const text = input.value.trim();
                if (!text) return;
                const parts = text.split('|');
                if (parts.length < 2) { alert('格式: 名称|URL'); return; }
                const name = parts[0].trim();
                const url = parts[1].trim();
                if (!name || !url) { alert('请填写完整'); return; }
                const friends = await loadZhddFile('data/friends.zhdd', []);
                friends.push({ id: Date.now().toString(), name, url });
                await saveZhddFile('data/friends.zhdd', friends, '添加友链');
                input.value = '';
                loadFriends();
            });

            async function deleteFriend(id) {
                const friends = await loadZhddFile('data/friends.zhdd', []);
                const idx = friends.findIndex(f => f.id === id);
                if (idx === -1) return;
                friends.splice(idx, 1);
                await saveZhddFile('data/friends.zhdd', friends, '删除友链');
                loadFriends();
            }

            // ============================================================
            //  初始化
            // ============================================================
            (function init() {
                const loggedIn = sessionStorage.getItem('admin_logged_in');
                if (loggedIn === 'true') {
                    const email = sessionStorage.getItem('admin_email') || ADMIN_EMAIL;
                    showAdminPanel(email);
                } else {
                    loginPage.style.display = 'block';
                    adminPanel.style.display = 'none';
                }
            })();

        })();
    </script>

</body>
</html>
