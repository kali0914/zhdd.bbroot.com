<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 · ZHDD网安空间</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;
            background:#0b0e14; color:#e8edf5;
            min-height:100vh; display:flex; flex-direction:column;
        }
        a { text-decoration:none; color:inherit; }
        .navbar {
            background:rgba(13,18,28,0.92);
            backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(0,255,200,0.15);
            padding:0 2rem;
            height:72px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 4px 30px rgba(0,0,0,0.5);
        }
        .logo {
            display:flex;
            align-items:center;
            gap:10px;
            font-size:1.5rem;
            font-weight:700;
            letter-spacing:1px;
            color:#00f5d4;
            text-shadow:0 0 20px rgba(0,245,212,0.2);
        }
        .logo-icon {
            width:36px; height:36px;
            background:linear-gradient(135deg,#00f5d4,#0077b6);
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            font-weight:800;
            color:#0b0e14;
            box-shadow:0 0 20px rgba(0,245,212,0.25);
        }
        .nav-links {
            display:flex;
            gap:4px;
            list-style:none;
            align-items:center;
        }
        .nav-links li { display:inline; }
        .nav-btn {
            background:transparent;
            border:none;
            color:#a0b4c8;
            font-size:1rem;
            font-weight:500;
            padding:8px 18px;
            border-radius:30px;
            cursor:pointer;
            transition:all .25s ease;
            font-family:inherit;
            letter-spacing:.3px;
            position:relative;
        }
        .nav-btn:hover { color:#fff; background:rgba(0,245,212,0.08); }
        .nav-btn.active {
            color:#00f5d4;
            background:rgba(0,245,212,0.12);
            box-shadow:0 0 20px rgba(0,245,212,0.06);
        }
        .nav-btn.active::after {
            content:''; position:absolute; bottom:2px; left:50%;
            transform:translateX(-50%); width:20px; height:2px;
            background:#00f5d4; border-radius:4px;
            box-shadow:0 0 12px #00f5d4;
        }
        .nav-btn a { display:block; }
        .user-area { display:flex; align-items:center; gap:12px; }
        .btn-login {
            padding:8px 24px;
            background:linear-gradient(135deg,#00f5d4,#0077b6);
            border:none;
            border-radius:30px;
            color:#0b0e14;
            font-weight:700;
            font-size:.95rem;
            cursor:pointer;
            transition:.3s;
            font-family:inherit;
            box-shadow:0 4px 20px rgba(0,245,212,0.15);
        }
        .btn-login:hover { transform:scale(1.03); box-shadow:0 8px 30px rgba(0,245,212,0.25); }
        .btn-login a { color:#0b0e14; }
        .user-avatar {
            width:40px; height:40px;
            border-radius:50%;
            background:linear-gradient(135deg,#00f5d4,#0077b6);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
            font-size:1.1rem;
            color:#0b0e14;
            cursor:pointer;
            transition:.3s;
            box-shadow:0 0 20px rgba(0,245,212,0.15);
            flex-shrink:0;
        }
        .user-avatar:hover { transform:scale(1.05); box-shadow:0 0 30px rgba(0,245,212,0.3); }
        .user-avatar.hidden { display:none; }
        .btn-login.hidden { display:none; }
        .main-container {
            flex:1;
            max-width:1200px;
            margin:0 auto;
            padding:2rem 1.5rem 3rem;
            width:100%;
        }
        .announcement {
            background:rgba(0,245,212,0.05);
            border:1px solid rgba(0,245,212,0.15);
            border-radius:12px;
            padding:0.8rem 1.5rem;
            margin-bottom:1.5rem;
            text-align:center;
            color:#b8ccdd;
            font-size:.95rem;
        }
        .announcement strong { color:#00f5d4; }
        .time-capsule {
            display:flex;
            align-items:center;
            gap:16px;
            background:rgba(255,255,255,0.03);
            backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:20px;
            padding:16px 24px;
            margin-bottom:2rem;
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            flex-wrap:wrap;
        }
        .time-capsule .capsule-icon { font-size:2.2rem; line-height:1; }
        .time-capsule .capsule-text { flex:1; }
        .time-capsule .capsule-title { font-size:0.85rem; color:#8aa3bc; letter-spacing:2px; }
        .time-capsule .capsule-duration { font-size:1.4rem; font-weight:600; color:#e8edf5; }
        .time-capsule .capsule-duration strong { color:#00f5d4; font-size:1.8rem; }
        .time-capsule .capsule-sub { font-size:0.8rem; color:#5a738a; letter-spacing:4px; margin-left:auto; }
        body.light-mode .time-capsule {
            background:rgba(255,255,255,0.5);
            border-color:rgba(0,0,0,0.06);
        }
        body.light-mode .time-capsule .capsule-duration { color:#1a202c; }
        body.light-mode .time-capsule .capsule-duration strong { color:#0077b6; }
        body.light-mode .time-capsule .capsule-title { color:#4a5568; }
        body.light-mode .time-capsule .capsule-sub { color:#8aa3bc; }
        @media (max-width:600px) {
            .time-capsule { flex-direction:column; text-align:center; }
            .time-capsule .capsule-sub { margin-left:0; }
            .time-capsule .capsule-duration { font-size:1.1rem; }
            .time-capsule .capsule-duration strong { font-size:1.4rem; }
        }

        .hero {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:2rem 1rem 1rem;
        }
        .hero h1 {
            font-size:3.8rem;
            font-weight:800;
            background:linear-gradient(135deg,#00f5d4 0%,#48cae4 50%,#0077b6 100%);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            letter-spacing:2px;
            margin-bottom:.5rem;
        }
        .hero .subtitle {
            font-size:1.3rem;
            color:#8aa3bc;
            margin-bottom:2rem;
            font-weight:300;
            letter-spacing:4px;
        }
        .hero .desc {
            max-width:700px;
            font-size:1.1rem;
            line-height:1.9;
            color:#b8ccdd;
            background:rgba(255,255,255,0.03);
            padding:1.8rem 2.5rem;
            border-radius:20px;
            border:1px solid rgba(0,245,212,0.08);
            backdrop-filter:blur(4px);
        }
        .hero .desc span { color:#00f5d4; font-weight:600; }
        .badge-grid {
            display:flex;
            gap:2rem;
            margin-top:2.5rem;
            flex-wrap:wrap;
            justify-content:center;
        }
        .badge-item {
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(0,245,212,0.10);
            border-radius:16px;
            padding:1rem 2rem;
            min-width:140px;
            text-align:center;
            transition:.3s;
        }
        .badge-item:hover {
            border-color:rgba(0,245,212,0.30);
            background:rgba(0,245,212,0.05);
            transform:translateY(-4px);
        }
        .badge-item .number { font-size:2rem; font-weight:700; color:#00f5d4; }
        .badge-item .label { font-size:.85rem; color:#8aa3bc; margin-top:4px; }

        .footer {
            text-align:center;
            padding:2rem 1.5rem 1.5rem;
            border-top:1px solid rgba(255,255,255,0.04);
            color:#5a738a;
            font-size:.85rem;
            letter-spacing:.5px;
            background:rgba(13,18,28,0.6);
            backdrop-filter:blur(8px);
        }
        .footer span { color:#00f5d4; }
        .footer .admin-link {
            display:inline-block;
            margin-top:8px;
            color:#5a738a;
            font-size:.85rem;
            transition:.3s;
            border-bottom:1px dashed #5a738a;
        }
        .footer .admin-link:hover { color:#00f5d4; border-bottom-color:#00f5d4; }
        @media (max-width:820px) {
            .navbar { padding:0 1.2rem; height:64px; flex-wrap:wrap; }
            .logo { font-size:1.2rem; }
            .logo-icon { width:30px; height:30px; font-size:14px; }
            .nav-links { gap:2px; }
            .nav-btn { font-size:.8rem; padding:6px 12px; }
            .hero h1 { font-size:2.4rem; }
            .hero .desc { padding:1.2rem 1.5rem; font-size:.98rem; }
            .badge-item { padding:.8rem 1.2rem; min-width:100px; }
            .badge-item .number { font-size:1.5rem; }
            .user-area .btn-login { padding:6px 16px; font-size:.85rem; }
            .user-area .user-avatar { width:34px; height:34px; font-size:.9rem; }
        }
        @media (max-width:480px) {
            .navbar { padding:0 .8rem; height:58px; }
            .nav-btn { font-size:.7rem; padding:4px 8px; }
            .logo { font-size:1rem; }
            .logo-icon { width:26px; height:26px; font-size:12px; }
            .hero h1 { font-size:1.8rem; }
            .hero .subtitle { font-size:.95rem; letter-spacing:2px; }
            .user-area .btn-login { padding:4px 12px; font-size:.75rem; }
            .user-area .user-avatar { width:30px; height:30px; font-size:.8rem; }
            .time-capsule { padding:12px; }
            .time-capsule .capsule-duration { font-size:1rem; }
            .time-capsule .capsule-duration strong { font-size:1.2rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="logo-icon">Z</span><span id="brandName">ZHDD 网安空间</span></div>
        <ul class="nav-links">
            <li><a href="index.html"><button class="nav-btn active" id="navHome">首页</button></a></li>
            <li><a href="members.html"><button class="nav-btn" id="navMembers">成员</button></a></li>
            <li><a href="about.html"><button class="nav-btn" id="navAbout">简介</button></a></li>
            <li><a href="join.html"><button class="nav-btn" id="navJoin">加入我们</button></a></li>
            <li><a href="articles.html"><button class="nav-btn" id="navArticles">文章</button></a></li>
        </ul>
        <div class="user-area">
            <button class="btn-login" id="loginNavBtn"><a href="login.html" id="loginLink">登录 / 注册</a></button>
            <div class="user-avatar hidden" id="userAvatar" title="个人中心"></div>
        </div>
    </nav>

    <div class="main-container">
        <div id="announcement" class="announcement" style="display:none;"></div>

        <div class="time-capsule">
            <div class="capsule-icon">⏳</div>
            <div class="capsule-text">
                <div class="capsule-title">ZHDD 网安空间</div>
                <div class="capsule-duration" id="timeCapsule">已陪伴你 <strong>0</strong> 天</div>
            </div>
            <div class="capsule-sub">请循其本 · 不忘初心</div>
        </div>

        <div class="hero">
            <h1 id="homeTitle">ZHDD 网安空间</h1>
            <p class="subtitle" id="homeSubtitle">—— 守护数字边界 · 铸就安全未来 ——</p>
            <div class="desc" id="homeDesc">
                <span>ZHDD网安空间</span> 专注于网络安全攻防与信息化建设，
                为政企客户提供<strong>渗透测试</strong>、<strong>安全加固</strong>、
                <strong>应急响应</strong>及<strong>等保合规</strong>一站式服务。
                以技术为盾，以创新为矛，捍卫每一寸数字疆域。
            </div>
            <div class="badge-grid" id="badgeGrid">
                <div class="badge-item"><div class="number">7×24</div><div class="label">应急响应</div></div>
                <div class="badge-item"><div class="number">100+</div><div class="label">服务客户</div></div>
                <div class="badge-item"><div class="number">99.9%</div><div class="label">威胁拦截率</div></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <span id="footerCopyright">&copy; 2026 ZHDD 网安空间 — 守护数字边界 · 铸就安全未来</span><br />
        <a href="admin.html" class="admin-link" id="adminLink">🔧 管理后台</a>
    </footer>

    <script src="utils.js"></script>
    <script>
        const WEATHER_KEY = '07e8471d0ce7eb25577ea4a041bf3e4c';

        function updateTimeCapsule() {
            const startDate = new Date(2026, 6, 9);
            const now = new Date();
            const diffMs = now - startDate;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const el = document.getElementById('timeCapsule');
            if (el) {
                if (diffDays < 1) {
                    el.innerHTML = `已陪伴你 <strong>${diffHours}</strong> 小时`;
                } else {
                    el.innerHTML = `已陪伴你 <strong>${diffDays}</strong> 天 <strong>${diffHours}</strong> 小时`;
                }
            }
        }
        updateTimeCapsule();
        setInterval(updateTimeCapsule, 60000);

        const DEFAULT_CONFIG = {
            site_name: 'ZHDD 网安空间',
            announcement: { content: '🎉 欢迎来到 ZHDD 网安空间！我们正在招募新成员，期待你的加入。' },
            nav: {
                home: '首页',
                members: '成员',
                about: '简介',
                join: '加入我们',
                articles: '文章',
                login: '登录 / 注册',
                admin: '🔧 管理后台'
            },
            home: {
                title: 'ZHDD 网安空间',
                subtitle: '—— 守护数字边界 · 铸就安全未来 ——',
                description: '<span>ZHDD网安空间</span> 专注于网络安全攻防与信息化建设，为政企客户提供<strong>渗透测试</strong>、<strong>安全加固</strong>、<strong>应急响应</strong>及<strong>等保合规</strong>一站式服务。以技术为盾，以创新为矛，捍卫每一寸数字疆域。',
                badges: [
                    { number: '7×24', label: '应急响应' },
                    { number: '100+', label: '服务客户' },
                    { number: '99.9%', label: '威胁拦截率' }
                ]
            },
            footer: {
                copyright: '© 2026 ZHDD 网安空间 — 守护数字边界 · 铸就安全未来'
            }
        };

        function renderPage(config) {
            if (config.site_name) {
                document.title = config.site_name;
                document.getElementById('brandName').textContent = config.site_name;
            }
            if (config.nav) {
                document.getElementById('navHome').textContent = config.nav.home || '首页';
                document.getElementById('navMembers').textContent = config.nav.members || '成员';
                document.getElementById('navAbout').textContent = config.nav.about || '简介';
                document.getElementById('navJoin').textContent = config.nav.join || '加入我们';
                document.getElementById('navArticles').textContent = config.nav.articles || '文章';
                document.getElementById('loginLink').textContent = config.nav.login || '登录 / 注册';
                document.getElementById('adminLink').textContent = config.nav.admin || '🔧 管理后台';
            }
            const annEl = document.getElementById('announcement');
            if (config.announcement && config.announcement.content) {
                annEl.innerHTML = '📢 ' + config.announcement.content;
                annEl.style.display = 'block';
            } else {
                annEl.style.display = 'none';
            }
            if (config.home) {
                document.getElementById('homeTitle').textContent = config.home.title || 'ZHDD 网安空间';
                document.getElementById('homeSubtitle').textContent = config.home.subtitle || '';
                document.getElementById('homeDesc').innerHTML = config.home.description || '';
                const badges = config.home.badges || [];
                document.getElementById('badgeGrid').innerHTML = badges.map(b =>
                    `<div class="badge-item"><div class="number">${b.number}</div><div class="label">${b.label}</div></div>`
                ).join('');
            }
            if (config.footer) {
                document.getElementById('footerCopyright').innerHTML = config.footer.copyright || '';
            }
        }

        function loadConfig() {
            renderPage(DEFAULT_CONFIG);
            console.log('✅ 使用内置配置');
        }

        function checkAuth() {
            const stored = sessionStorage.getItem('currentUser');
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    document.getElementById('loginNavBtn').classList.add('hidden');
                    const avatar = document.getElementById('userAvatar');
                    avatar.classList.remove('hidden');
                    avatar.textContent = (user.display_name || user.username || 'U').charAt(0).toUpperCase();
                } catch (e) {}
            }
        }

        checkAuth();
        loadConfig();
    </script>
</body>
</html>
