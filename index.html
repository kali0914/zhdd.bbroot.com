<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <style>
        /* ===== 基础样式 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;
            background:#0b0e14; color:#e8edf5;
            min-height:100vh; display:flex; flex-direction:column;
        }
        a { text-decoration:none; color:inherit; }

        /* ===== 导航栏 ===== */
        .navbar {
            background:rgba(13,18,28,0.92);
            backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(0,255,200,0.15);
            padding:0 2rem;
            height:72px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 4px 30px rgba(0,0,0,0.5);
        }
        .logo {
            display:flex;
            align-items:center;
            gap:10px;
            font-size:1.5rem;
            font-weight:700;
            letter-spacing:1px;
            color:#00f5d4;

        }
        .logo-icon {
            width:36px; height:36px;

            border-radius:8px;
            display:flex;

            justify-content:center;
            font-size:18px;
            font-weight:800;
            color:#0b0e14;
            box-shadow:0 0 20px rgba(0,245,212,0.25);
        }
        .nav-links {
            display:flex;
            gap:4px;
            list-style:none;
            align-items:center;
        }
        .nav-links li { display:inline; }
        .nav-btn {
            background:transparent;
            border:none;
            color:#a0b4c8;
            font-size:1rem;
            font-weight:500;
            padding:8px 18px;
            border-radius:30px;
            cursor:pointer;
            transition:all .25s ease;
            font-family:inherit;
            letter-spacing:.3px;
            position:relative;
        }
        .nav-btn:hover { color:#fff; background:rgba(0,245,212,0.08); }
        .nav-btn.active {
            color:#00f5d4;
            background:rgba(0,245,212,0.12);
            box-shadow:0 0 20px rgba(0,245,212,0.06);
        }
        .nav-btn.active::after {
            content:''; position:absolute; bottom:2px; left:50%;
            transform:translateX(-50%); width:20px; height:2px;
            background:#00f5d4; border-radius:4px;
            box-shadow:0 0 12px #00f5d4;
        }
        .nav-btn a { display:block; }
        .user-area {
            display:flex;
            align-items:center;
            gap:12px;
        }
        .btn-login {
            padding:8px 24px;
            background:linear-gradient(135deg,#00f5d4,#0077b6);
            border:none;
            border-radius:30px;
            color:#0b0e14;
            font-weight:700;
            font-size:.95rem;
            cursor:pointer;
            transition:.3s;
            font-family:inherit;
            box-shadow:0 4px 20px rgba(0,245,212,0.15);
        }
        .btn-login:hover { transform:scale(1.03); box-shadow:0 8px 30px rgba(0,245,212,0.25); }
        .btn-login a { color:#0b0e14; }
        .user-avatar {
            width:40px; height:40px;
            border-radius:50%;
            background:linear-gradient(135deg,#00f5d4,#0077b6);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
            font-size:1.1rem;
            color:#0b0e14;
            cursor:pointer;

            box-shadow:0 0 20px rgba(0,245,212,0.15);

        }
        .user-avatar:hover { transform:scale(1.05); box-shadow:0 0 30px rgba(0,245,212,0.3); }
        .user-avatar.hidden { display:none; }
        .btn-login.hidden { display:none; }

        /* ===== 主容器 ===== */
        .main-container {
            flex:1;
            max-width:1200px;
            margin:0 auto;
            padding:2rem 1.5rem 3rem;
            width:100%;
        }

        /* ===== 公告栏 ===== */
        .announcement {
            background:rgba(0,245,212,0.05);
            border:1px solid rgba(0,245,212,0.15);
            border-radius:12px;
            padding:0.8rem 1.5rem;

            text-align:center;
            color:#b8ccdd;
            font-size:.95rem;
        }
        .announcement strong { color:#00f5d4; }

        /* ===== 时间胶囊 ===== */
        .time-capsule {

            gap:16px;

        .time-capsule .capsule-text { flex:1; }
        .time-capsule .capsule-title { font-size:0.85rem; color:#8aa3bc; letter-spacing:2px; }
        .time-capsule .capsule-duration { font-size:1.4rem; font-weight:600; color:#e8edf5; }
        .time-capsule .capsule-duration strong { color:#00f5d4; font-size:1.8rem; }
        .time-capsule .capsule-sub { font-size:0.8rem; color:#5a738a; letter-spacing:4px; margin-left:auto; }
        body.light-mode .time-capsule {

            .time-capsule .capsule-sub { margin-left:0; }
            .time-capsule .capsule-duration { font-size:1.1rem; }
            .time-capsule .capsule-duration strong { font-size:1.4rem; }

        /* ===== 首页 ===== */
        .hero {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:3rem 1rem 2rem;
            min-height:60vh;

        .hero h1 {
            font-size:3.8rem;

            background:linear-gradient(135deg,#00f5d4 0%,#48cae4 50%,#0077b6 100%);

            margin-bottom:2rem;
            font-weight:300;
            letter-spacing:4px;
        }
        .hero .desc {
            max-width:700px;
            font-size:1.1rem;
            line-height:1.9;
            color:#b8ccdd;
            background:rgba(255,255,255,0.03);
            padding:1.8rem 2.5rem;
            border-radius:20px;
            border:1px solid rgba(0,245,212,0.08);
            backdrop-filter:blur(4px);
        }
        .hero .desc span { color:#00f5d4; font-weight:600; }
        .badge-grid {
            display:flex;
            gap:2rem;
            margin-top:2.5rem;
            flex-wrap:wrap;
            justify-content:center;
        }
        .badge-item {
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(0,245,212,0.10);
            border-radius:16px;
            padding:1rem 2rem;

            transition:.3s;
        }
        .badge-item:hover {

        /* ===== 天气悬浮组件 ===== */
        .weather-widget {
            position:fixed;
            right:20px;
            top:50%;
            transform:translateY(-50%);
            z-index:999;
            background:rgba(13,18,28,0.75);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:20px;
            padding:18px 20px 16px;
            min-width:140px;
            box-shadow:0 8px 40px rgba(0,0,0,0.4);
            transition:all .3s ease;
            cursor:default;
            user-select:none;
        }
        .weather-widget:hover {
            transform:translateY(-50%) scale(1.02);
            border-color:rgba(0,245,212,0.15);
            box-shadow:0 8px 50px rgba(0,245,212,0.05);

        .weather-widget .city { font-size:.85rem; color:#8aa3bc; letter-spacing:1px; margin-bottom:4px; }
        .weather-widget .temp-range { font-size:.75rem; color:#5a738a; }
        .weather-widget .temp-current { font-size:2.4rem; font-weight:700; color:#e8edf5; line-height:1.2; }
        .weather-widget .temp-current sup { font-size:1rem; color:#8aa3bc; font-weight:400; }
        .weather-widget .humidity { font-size:.8rem; color:#8aa3bc; margin-top:2px; }
        .weather-widget .care { font-size:.75rem; color:#00f5d4; margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.04); letter-spacing:.5px; }
        .weather-widget .loading-dots::after { content:'...'; animation:dots 1.2s steps(4) infinite; }
        @keyframes dots { 0%{ content:''; } 25%{ content:'.'; } 50%{ content:'..'; } 75%{ content:'...'; } }
        body.light-mode .weather-widget {
            background:rgba(240,244,248,0.85);
            border-color:rgba(0,0,0,0.06);
            box-shadow:0 8px 40px rgba(0,0,0,0.06);
        }
        body.light-mode .weather-widget .city { color:#4a5568; }
        body.light-mode .weather-widget .temp-current { color:#1a202c; }
        body.light-mode .weather-widget .temp-current sup { color:#4a5568; }
        body.light-mode .weather-widget .temp-range { color:#718096; }
        body.light-mode .weather-widget .humidity { color:#4a5568; }
        body.light-mode .weather-widget .care { color:#0077b6; border-top-color:rgba(0,0,0,0.06); }

        /* ===== 页脚 ===== */
        .footer {
            text-align:center;

            border-top:1px solid rgba(255,255,255,0.04);

        .footer .admin-link:hover { color:#00f5d4; border-bottom-color:#00f5d4; }

            .logo { font-size:1.2rem; }
            .logo-icon { width:30px; height:30px; font-size:14px; }
            .nav-links { gap:2px; }
            .nav-btn { font-size:.8rem; padding:6px 12px; }
            .hero h1 { font-size:2.4rem; }
            .hero .desc { padding:1.2rem 1.5rem; font-size:.98rem; }
            .badge-item { padding:.8rem 1.2rem; min-width:100px; }

            .user-area .btn-login { padding:6px 16px; font-size:.85rem; }
            .user-area .user-avatar { width:34px; height:34px; font-size:.9rem; }
            .weather-widget { right:12px; padding:14px 16px 12px; min-width:110px; }
            .weather-widget .temp-current { font-size:1.8rem; }
            .weather-widget .city { font-size:.75rem; }
        }
        @media (max-width:480px) {
            .navbar { padding:0 .8rem; height:58px; }
            .nav-btn { font-size:.7rem; padding:4px 8px; }
            .logo { font-size:1rem; }

            .hero h1 { font-size:1.8rem; }
            .hero .subtitle { font-size:.95rem; letter-spacing:2px; }
            .user-area .btn-login { padding:4px 12px; font-size:.75rem; }
            .user-area .user-avatar { width:30px; height:30px; font-size:.8rem; }
            .time-capsule { padding:12px; }

            .time-capsule .capsule-duration strong { font-size:1.2rem; }
            .weather-widget { right:8px; padding:10px 12px 10px; min-width:90px; border-radius:14px; }
            .weather-widget .temp-current { font-size:1.4rem; }
            .weather-widget .city { font-size:.65rem; }
            .weather-widget .humidity { font-size:.65rem; }
            .weather-widget .care { font-size:.6rem; }
        }
    </style>
</head>

    <!-- ===== 页脚 ===== -->

        <a href="admin.html" class="admin-link" id="adminLink">🔧 管理后台</a>
    </footer>

    <script>
        // ============================================================
        //  高德天气 API Key
        // ============================================================
        const WEATHER_KEY = '07e8471d0ce7eb25577ea4a041bf3e4c';

        // ============================================================
        //  时间胶囊
        // ============================================================
        function updateTimeCapsule() {
            const startDate = new Date(2026, 6, 9);
            const now = new Date();
            const diffMs = now - startDate;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const el = document.getElementById('timeCapsule');
            if (el) {
                if (diffDays < 1) {
                    el.innerHTML = `已陪伴你 <strong>${diffHours}</strong> 小时`;
                } else {
                    el.innerHTML = `已陪伴你 <strong>${diffDays}</strong> 天 <strong>${diffHours}</strong> 小时`;
                }
            }
        }
        updateTimeCapsule();
        setInterval(updateTimeCapsule, 60000);

        // ============================================================
        //  天气组件
        // ============================================================
        async function fetchWeather() {
            const cityEl = document.getElementById('weatherCity');
            const rangeEl = document.getElementById('weatherRange');
            const tempEl = document.getElementById('weatherTemp');
            const humidityEl = document.getElementById('weatherHumidity');
            const careEl = document.getElementById('weatherCare');

            try {
                const ipRes = await fetch(`https://restapi.amap.com/v3/ip?key=${WEATHER_KEY}`);
                if (!ipRes.ok) throw new Error('IP定位失败');
                const ipData = await ipRes.json();
                if (ipData.status !== '1') throw new Error(ipData.info);
                const adcode = ipData.adcode;
                const cityName = ipData.city || '未知城市';
                cityEl.textContent = cityName;

                const weatherRes = await fetch(
                    `https://restapi.amap.com/v3/weather/weatherInfo?city=${adcode}&key=${WEATHER_KEY}&extensions=base`
                );
                if (!weatherRes.ok) throw new Error('天气查询失败');
                const weatherData = await weatherRes.json();
                if (weatherData.status !== '1') throw new Error(weatherData.info);

                const live = weatherData.lives?.[0];
                if (!live) throw new Error('无天气数据');

                const temp = parseInt(live.temperature);
                const humidity = live.humidity;
                const tempMin = parseInt(live.temperature_min) || temp - 2;
                const tempMax = parseInt(live.temperature_max) || temp + 2;

                rangeEl.textContent = `${tempMin}° ~ ${tempMax}°`;
                tempEl.innerHTML = `${temp}<sup>°C</sup>`;
                humidityEl.textContent = `湿度 ${humidity}%`;

                let careText = '';
                let careIcon = '';
                if (temp >= 30) { careIcon = '🔥';
                    careText = '高温天气，注意防暑'; } else if (temp >= 25) { careIcon = '☀️';
                    careText = '天气温暖，适合出行'; } else if (temp >= 15) { careIcon = '🌤️';
                    careText = '温度舒适，宜人'; } else if (temp >= 5) { careIcon = '🧥';
                    careText = '天气偏凉，注意添衣'; } else { careIcon = '❄️';
                    careText = '天气寒冷，注意保暖'; }
                careEl.textContent = `${careIcon} ${careText}`;

            } catch (err) {
                console.warn('天气加载失败:', err.message);
                cityEl.textContent = '天气加载失败';
                rangeEl.textContent = '';
                tempEl.innerHTML = '--<sup>°C</sup>';
                humidityEl.textContent = '湿度 --%';
                careEl.textContent = '🌐 请稍后重试';
            }
        }

        // ============================================================
        //  加载网站配置
        // ============================================================
        // 由于 GitCode 目前无法接入，使用内置默认配置
        const DEFAULT_CONFIG = {
            site_name: 'ZHDD 网安空间',
            announcement: { content: '🎉 欢迎来到 ZHDD 网安空间！我们正在招募新成员，期待你的加入。' },
            nav: {
                home: '首页',
                members: '成员',
                about: '简介',
                join: '加入我们',
                articles: '文章',
                login: '登录 / 注册',
                admin: '🔧 管理后台'
            },
            home: {
                title: 'ZHDD 网安空间',
                subtitle: '—— 守护数字边界 · 铸就安全未来 ——',
                description: '<span>ZHDD网安空间</span> 专注于网络安全攻防与信息化建设，为政企客户提供<strong>渗透测试</strong>、<strong>安全加固</strong>、<strong>应急响应</strong>及<strong>等保合规</strong>一站式服务。以技术为盾，以创新为矛，捍卫每一寸数字疆域。',
                badges: [
                    { number: '7×24', label: '应急响应' },
                    { number: '100+', label: '服务客户' },
                    { number: '99.9%', label: '威胁拦截率' }
                ]
            },
            footer: {
                copyright: '© 2026 ZHDD 网安空间 — 守护数字边界 · 铸就安全未来'
            }
        };

        function renderPage(config) {
            if (config.site_name) {
                document.title = config.site_name;
                document.getElementById('brandName').textContent = config.site_name;
            }
            if (config.nav) {
                document.getElementById('navHome').textContent = config.nav.home || '首页';
                document.getElementById('navMembers').textContent = config.nav.members || '成员';
                document.getElementById('navAbout').textContent = config.nav.about || '简介';
                document.getElementById('navJoin').textContent = config.nav.join || '加入我们';
                document.getElementById('navArticles').textContent = config.nav.articles || '文章';
                document.getElementById('loginLink').textContent = config.nav.login || '登录 / 注册';
                document.getElementById('adminLink').textContent = config.nav.admin || '🔧 管理后台';
            }
            const annEl = document.getElementById('announcement');
            if (config.announcement && config.announcement.content) {
                annEl.innerHTML = '📢 ' + config.announcement.content;
                annEl.style.display = 'block';
            } else {
                annEl.style.display = 'none';
            }
            if (config.home) {
                document.getElementById('homeTitle').textContent = config.home.title || 'ZHDD 网安空间';
                document.getElementById('homeSubtitle').textContent = config.home.subtitle || '';
                document.getElementById('homeDesc').innerHTML = config.home.description || '';
                const badges = config.home.badges || [];
                document.getElementById('badgeGrid').innerHTML = badges.map(b =>
                    `<div class="badge-item"><div class="number">${b.number}</div><div class="label">${b.label}</div></div>`
                ).join('');
            }
            if (config.footer) {
                document.getElementById('footerCopyright').innerHTML = config.footer.copyright || '';
            }
        }

        function loadConfig() {
            renderPage(DEFAULT_CONFIG);
            // 尝试从 GitCode 加载（如果可用）
            // 由于 GitCode 目前不可用，直接使用默认配置
            console.log('✅ 使用内置配置');
        }

        // ============================================================
        //  登录状态检查
        // ============================================================
        function checkAuth() {
            const stored = sessionStorage.getItem('currentUser');
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    document.getElementById('loginNavBtn').classList.add('hidden');
                    const avatar = document.getElementById('userAvatar');
                    avatar.classList.remove('hidden');
                    avatar.textContent = (user.display_name || user.username || 'U').charAt(0).toUpperCase();
                } catch (e) {}
            }
        }

        // ============================================================
        //  启动
        // ============================================================
        checkAuth();
        loadConfig();
        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000);
    </script>

</body>
</html>
