    <style>

 }

}

        .main-container { flex:1; max-width:1200px; margin:0 auto; padding:2rem 
1.5rem 3rem; width:100%; display:flex; align-items:center; justify-
content:center; }

        .auth-container {

align:center; letter-spacing:2px; text-shadow:0 0 40px rgba(0,245,212,0.15); }
        .sub-logo { text-align:center; color:#7a8fa3; font-size:.95rem; margin-
bottom:1.5rem; letter-spacing:1px; }

        /* 前置验证区 */
        .verify-area {
            text-align:center;
            padding:1rem 0;
        }
        .verify-hint {
            color:#a0b4c8;

        }
        .cf-turnstile {
            display:flex;

        }
        .verify-status {
            font-size:.9rem;

            margin-top:0.5rem;
        }

        /* ---- 二次验证：滑块 ---- */
        .slider-container {
            margin: 16px auto 10px auto;
            display: none; /* 默认隐藏，点击按钮后显示 */
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 6px 6px 6px 18px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 320px;
            width: 100%;
            user-select: none;
            touch-action: none;
            position: relative;
            transition: border-color 0.3s;
        }
        .slider-container.active {
            border-color: rgba(0,245,212,0.3);
        }
        .slider-track {
            position: relative;
            height: 44px;
            width: 100%;
            border-radius: 40px;
            background: rgba(255,255,255,0.03);
            overflow: hidden;
            cursor: grab;
        }
        .slider-track:active {
            cursor: grabbing;
        }
        .slider-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(0,245,212,0.15), rgba(0,245,212,0.3));
            border-radius: 40px;
            pointer-events: none;
            transition: width 0.05s linear;
        }
        .slider-thumb {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f5d4, #0077b6);
            box-shadow: 0 4px 20px rgba(0,245,212,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b0e14;
            font-size: 18px;
            font-weight: 700;
            cursor: grab;
            transition: box-shadow 0.2s;
            z-index: 2;
            pointer-events: none;
        }
        .slider-thumb:active {
            cursor: grabbing;
        }
        .slider-label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #7a8fa3;
            font-size: 0.9rem;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.3s;
        }
        .slider-label.done {
            opacity: 0;
        }
        .slider-status {
            font-size: 0.85rem;
            color: #7a8fa3;
            margin-top: 8px;
            text-align: center;
            min-height: 24px;
        }
        .slider-status.success {
            color: #00f5d4;
        }
        .slider-status.error {
            color: #ff6b6b;
        }

        /* 二次验证触发按钮 */

radius:40px; padding:4px; margin-bottom:1.5rem; }

0; border-radius:40px; font-size:.95rem; font-weight:600; color:#7a8fa3; 
cursor:pointer; transition:.3s; font-family:inherit; }

20px rgba(0,245,212,0.2); }

color:#a0b4c8; margin-bottom:4px; }

255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:16px;

transition:.2s; }

 font-weight:700; font-size:1rem; cursor:pointer; transition:.3s; font-
family:inherit; box-shadow:0 4px 30px rgba(0,245,212,0.15); }

1px solid rgba(255,107,107,0.15); }

border:1px solid rgba(0,245,212,0.15); }
        .code-row { display:flex; gap:10px; }
        .code-row input { flex:1; }
        .btn-send-code { padding:0 20px; background:rgba(255,255,255,0.06); 
border:1px solid rgba(255,255,255,0.08); border-radius:16px; color:#a0b4c8; 
cursor:pointer; transition:.3s; font-family:inherit; white-space:nowrap; }
        .btn-send-code:hover { background:rgba(0,245,212,0.08); border-color:
rgba(0,245,212,0.2); color:#00f5d4; }
        .btn-send-code:disabled { opacity:0.4; cursor:not-allowed; }
        .password-hint { font-size:.75rem; color:#5a738a; margin-top:4px; }

    <footer class="footer">

    <script src="utils.js"></script>
    <script>
        // ============================================================
        //  配置 & 初始化
        // ============================================================
        emailjs.init(EMAILJS_PUBLIC_KEY);

        const NAV_CONFIG = {
            site_name: 'ZHDD 网安空间',
            nav: {
                home: '首页',
                members: '成员',
                about: '简介',
                join: '加入我们',
                articles: '文章',
                login: '登录 / 注册',
                admin: '🔧 管理后台'
            },
            footer: {
                copyright: '© 2026 ZHDD 网安空间 — 守护数字边界 · 铸就安全未来'
            }
        };

        function renderNav() {
            const config = NAV_CONFIG;
            document.title = config.site_name + ' · 登录';
            document.getElementById('brandName').textContent = config.site_name;
            if (config.nav) {
                document.getElementById('navHome').textContent = config.nav.home || '首页';
                document.getElementById('navMembers').textContent = config.nav.members || '成员';
                document.getElementById('navAbout').textContent = config.nav.about || '简介';
                document.getElementById('navJoin').textContent = config.nav.join || '加入我们';
                document.getElementById('navArticles').textContent = config.nav.articles || '文章';
                document.getElementById('loginLink').textContent = config.nav.login || '登录 / 注册';
                document.getElementById('adminLink').textContent = config.nav.admin || '🔧 管理后台';
            }
            if (config.footer) {
                document.getElementById('footerCopyright').innerHTML = config.footer.copyright || '';
            }
        }
        renderNav();

        // ============================================================
        //  Turnstile 回调
        // ============================================================
        function onTurnstileSuccess(token) {
            document.getElementById('verifyStatus').textContent = '✅ 验证通过，正在加载表单...';
            document.getElementById('verifyArea').style.display = 'none';
            document.getElementById('formArea').style.display = 'block';
            sessionStorage.setItem('turnstile_verified', 'true');
        }

        function onTurnstileExpired() {
            document.getElementById('verifyStatus').textContent = '⏳ 验证已过期，请重新验证';
            document.getElementById('verifyArea').style.display = 'block';
            document.getElementById('formArea').style.display = 'none';
            sessionStorage.removeItem('turnstile_verified');
            if (window.turnstile) {
                const widgetId = window.turnstile.render(document.querySelector('.cf-turnstile'));
                window.turnstile.reset(widgetId);
            }
        }

        // ---- 页面加载时检查是否已验证 ----
        document.addEventListener('DOMContentLoaded', function() {
            if (sessionStorage.getItem('turnstile_verified') === 'true') {
                document.getElementById('verifyArea').style.display = 'none';
                document.getElementById('formArea').style.display = 'block';
                document.getElementById('verifyStatus').textContent = '✅ 已通过验证';
            }
        });

        // ============================================================
        //  二次验证：滑块（轨迹检测）
        // ============================================================
        (function() {
            const sliderContainer = document.getElementById('sliderContainer');
            const sliderTrack = document.getElementById('sliderTrack');
            const sliderThumb = document.getElementById('sliderThumb');
            const sliderFill = document.getElementById('sliderFill');
            const sliderLabel = document.getElementById('sliderLabel');
            const sliderStatus = document.getElementById('sliderStatus');
            const btnSecondary = document.getElementById('btnSecondaryVerify');

            let isDragging = false;
            let isVerified = false;
            let startX = 0;
            let currentX = 0;
            let trackRect = null;
            // 存储轨迹点用于直线检测
            let points = [];

            // ---- 显示滑块 ----
            function showSlider() {
                sliderContainer.style.display = 'block';
                sliderContainer.classList.add('active');
                // 重置状态
                resetSlider();
                sliderStatus.textContent = '请拖动滑块完成验证';
                sliderStatus.className = 'slider-status';
                // 隐藏触发按钮
                btnSecondary.classList.add('hidden');
            }

            // ---- 重置滑块 ----
            function resetSlider() {
                isDragging = false;
                isVerified = false;
                points = [];
                sliderThumb.style.left = '0px';
                sliderFill.style.width = '0%';
                sliderLabel.classList.remove('done');
                sliderLabel.textContent = '按住滑块拖动';
                sliderStatus.textContent = '';
                sliderStatus.className = 'slider-status';
                sliderContainer.classList.remove('active');
            }

            // ---- 检测轨迹是否为直线 ----
            function isStraightLine(points, threshold) {
                if (points.length < 5) return true; // 数据点太少，保守判断为直线
                // 计算所有点相对于起始点的偏移量
                const baseX = points[0].x;
                const baseY = points[0].y;
                // 计算整体位移方向（从起点到终点）
                const endX = points[points.length - 1].x;
                const endY = points[points.length - 1].y;
                const dx = endX - baseX;
                const dy = endY - baseY;
                const length = Math.sqrt(dx * dx + dy * dy);
                if (length < 5) return true; // 位移太小，视为无效

                // 计算每个点到起点-终点连线的垂直距离
                let maxDist = 0;
                for (let i = 0; i < points.length; i++) {
                    const px = points[i].x - baseX;
                    const py = points[i].y - baseY;
                    // 叉积绝对值 / 长度 = 点到直线的垂直距离
                    const dist = Math.abs(px * dy - py * dx) / length;
                    if (dist > maxDist) maxDist = dist;
                }
                // 如果最大偏移超过阈值，则认为不是直线（即允许放行）
                return maxDist < threshold;
            }

            // ---- 完成验证 ----
            function completeVerification() {
                if (isVerified) return;
                // 检测轨迹
                const threshold = 8; // 像素阈值，小于此值视为直线
                const straight = isStraightLine(points, threshold);

                if (straight) {
                    // 直线轨迹 → 不予放行
                    sliderStatus.textContent = '❌ 检测到直线轨迹，请重新滑动（需曲线轨迹）';
                    sliderStatus.className = 'slider-status error';
                    // 重置滑块
                    setTimeout(() => {
                        resetSlider();
                        sliderContainer.style.display = 'block';
                        sliderStatus.textContent = '请拖动滑块完成验证（曲线轨迹）';
                        sliderStatus.className = 'slider-status';
                    }, 1200);
                    return;
                }

                // 非直线轨迹 → 允许放行
                isVerified = true;
                sliderStatus.textContent = '✅ 二次验证通过！';
                sliderStatus.className = 'slider-status success';
                sliderLabel.classList.add('done');
                sliderContainer.classList.remove('active');

                // 模拟 Turnstile 验证成功
                // 这里直接触发表单显示
                document.getElementById('verifyStatus').textContent = '✅ 验证通过，正在加载表单...';
                document.getElementById('verifyArea').style.display = 'none';
                document.getElementById('formArea').style.display = 'block';
                sessionStorage.setItem('turnstile_verified', 'true');
                // 如果有 Turnstile 实例，也可以尝试重置
                if (window.turnstile) {
                    try {
                        const widgetId = window.turnstile.render(document.querySelector('.cf-turnstile'));
                        window.turnstile.reset(widgetId);
                    } catch(e) {}
                }
            }

            // ---- 事件绑定（鼠标 + 触摸） ----
            function getPos(e) {
                if (e.touches) {
                    return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
                }
                return { clientX: e.clientX, clientY: e.clientY };
            }

            function onStart(e) {
                if (isVerified) return;
                e.preventDefault();
                const pos = getPos(e);
                trackRect = sliderTrack.getBoundingClientRect();
                startX = pos.clientX;
                currentX = startX;
                // 记录第一个点
                const rect = sliderTrack.getBoundingClientRect();
                points = [{ x: pos.clientX - rect.left, y: pos.clientY - rect.top }];
                isDragging = true;
                sliderContainer.classList.add('active');
                sliderLabel.textContent = '拖动中...';
                sliderStatus.textContent = '';
                sliderStatus.className = 'slider-status';
            }

            function onMove(e) {
                if (!isDragging || isVerified) return;
                e.preventDefault();
                const pos = getPos(e);
                const rect = sliderTrack.getBoundingClientRect();
                let offset = pos.clientX - rect.left;
                // 限制范围
                const maxOffset = rect.width - 40; // 40px 为滑块宽度
                if (offset < 0) offset = 0;
                if (offset > maxOffset) offset = maxOffset;
                // 更新滑块位置
                sliderThumb.style.left = offset + 'px';
                sliderFill.style.width = (offset / maxOffset * 100) + '%';
                // 记录轨迹点（采样）
                const now = Date.now();
                const last = points.length > 0 ? points[points.length - 1] : null;
                if (!last || (pos.clientX - last.x) > 2 || (pos.clientY - last.y) > 2) {
                    points.push({ x: pos.clientX - rect.left, y: pos.clientY - rect.top });
                }
                // 如果滑块到达终点，自动完成
                if (offset >= maxOffset - 2) {
                    isDragging = false;
                    completeVerification();
                }
            }

            function onEnd(e) {
                if (!isDragging || isVerified) {
                    isDragging = false;
                    return;
                }
                isDragging = false;
                // 如果未到达终点，判断当前位置是否超过80%
                const rect = sliderTrack.getBoundingClientRect();
                const currentOffset = parseFloat(sliderThumb.style.left) || 0;
                const maxOffset = rect.width - 40;
                if (currentOffset / maxOffset > 0.8) {
                    // 接近终点，强制完成
                    sliderThumb.style.left = maxOffset + 'px';
                    sliderFill.style.width = '100%';
                    completeVerification();
                } else {
                    // 未完成，重置
                    sliderStatus.textContent = '请将滑块拖到最右侧';
                    sliderStatus.className = 'slider-status error';
                    setTimeout(() => {
                        resetSlider();
                        sliderContainer.style.display = 'block';
                        sliderStatus.textContent = '请拖动滑块完成验证（曲线轨迹）';
                        sliderStatus.className = 'slider-status';
                    }, 800);
                }
            }

            // 鼠标事件
            sliderTrack.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            // 触摸事件
            sliderTrack.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd, { passive: false });

            // ---- 点击“验证不了？点这里”按钮 ----
            btnSecondary.addEventListener('click', function() {
                // 如果已经通过 Turnstile 验证，则忽略
                if (sessionStorage.getItem('turnstile_verified') === 'true') return;
                showSlider();
            });

            // 暴露重置方法（供外部调用）
            window.resetSlider = resetSlider;
        })();


        // ============================================================
        //  Tab 切换
        // ============================================================
        document.getElementById('tabLogin').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
        });
        document.getElementById('tabRegister').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('forgotForm').style.display = 'none';
        });

        // ---- 忘记密码切换 ----
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'block';
        });
        document.getElementById('backToLogin').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        });

        // ============================================================
        //  注册逻辑
        // ============================================================
        let storedCode = '';

        document.getElementById('sendCodeBtn').addEventListener('click', async function() {
            const email = document.getElementById('regEmail').value.trim();
            if (!email || !email.includes('@')) { alert('请填写正确的邮箱'); return; }
            const code = String(Math.floor(100000 + Math.random() * 900000));
            storedCode = code;
            this.disabled = true;
            this.textContent = '⏳ 发送中...';
            try {
                const raw = await fetchEmailTemplate('register_code');
                const htmlContent = renderTemplate(raw, { code, email });
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email,
                    htmlContent: htmlContent
                });
                alert('✅ 验证码已发送');
                let countdown = 60;
                this.textContent = `重新发送(${countdown}s)`;
                const timer = setInterval(() => {
                    countdown--;
                    this.textContent = `重新发送(${countdown}s)`;
                    if (countdown <= 0) { clearInterval(timer); this.disabled = false; this.textContent = '发送验证码'; }
                }, 1000);
            } catch (e) {
                alert('❌ 发送失败: ' + e.message);
                this.disabled = false;
                this.textContent = '发送验证码';
            }
        });

        document.getElementById('registerBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            const form = document.getElementById('registerForm');
            const msg = document.getElementById('registerMessage');
            msg.textContent = '';
            msg.className = 'message';

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const confirm = document.getElementById('regConfirm').value.trim();
            const code = document.getElementById('regCode').value.trim();

            if (!/^[a-zA-Z0-9_-]{4,20}$/.test(username)) {
                msg.textContent = '⚠️ 用户名只能包含字母、数字、下划线和减号，长度4-20位';
                msg.className = 'message error';
                return;
            }
            if (!email || !password || !confirm || !code) {
                msg.textContent = '⚠️ 请填写所有字段';
                msg.className = 'message error';
                return;
            }
            if (password.length < 6) {
                msg.textContent = '⚠️ 密码至少6位';
                msg.className = 'message error';
                return;
            }
            if (password !== confirm) {
                msg.textContent = '⚠️ 两次密码不一致';
                msg.className = 'message error';
                return;
            }
            if (code !== storedCode) {
                msg.textContent = '⚠️ 验证码错误';
                msg.className = 'message error';
                return;
            }

            this.disabled = true;
            msg.textContent = '⏳ 注册中...';
            msg.className = 'message';

            try {
                const listRes = await fetch(`${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${USERS_DIR}?branch=main`);
                if (listRes.ok) {
                    const listData = await listRes.json();
                    if (Array.isArray(listData)) {
                        for (const item of listData) {
                            if (item.type === 'dir') {
                                const profile = await loadUserFile(item.name, 'profile', null);
                                if (profile && profile.username === username) {
                                    throw new Error('用户名已存在');
                                }
                                if (profile && profile.email === email) {
                                    throw new Error('邮箱已被注册');
                                }
                            }
                        }
                    }
                } else if (listRes.status !== 404) {
                    throw new Error(`检查用户列表失败: ${listRes.status}`);
                }

                const salt = Math.random().toString(36).substring(2, 15);
                const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password + salt));
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const passwordHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                await saveUserFile(username, 'profile', {
                    username, email, display_name: username,
                    bio: '', avatar_url: '', role: 'member', is_member: false,
                    theme_preference: 'dark',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
                await saveUserFile(username, 'credentials', { password_hash: passwordHash, salt: salt });
                await saveUserFile(username, 'articles', []);
                await saveUserFile(username, 'operations', [{ action: '注册', details: `用户 ${username} 注册成功`, created_at: new Date().toISOString() }]);
                await saveUserFile(username, 'favorites', []);
                await saveUserFile(username, 'comments', []);

                msg.textContent = '✅ 注册成功！正在跳转...';
                msg.className = 'message success';
                const user = { username, email, display_name: username, role: 'member', is_member: false };
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } catch (err) {
                msg.textContent = '❌ ' + err.message;
                msg.className = 'message error';
            } finally {
                this.disabled = false;
            }
        });

        // ============================================================
        //  登录逻辑
        // ============================================================
        document.getElementById('loginBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            const form = document.getElementById('loginForm');
            const msg = document.getElementById('loginMessage');
            msg.textContent = '';
            msg.className = 'message';

            const identifier = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!identifier || !password) {
                msg.textContent = '⚠️ 请填写用户名和密码';
                msg.className = 'message error';
                return;
            }

            this.disabled = true;
            msg.textContent = '⏳ 登录中...';
            msg.className = 'message';

            try {
                const listRes = await fetch(`${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${USERS_DIR}?branch=main`);
                let foundUser = null;
                if (listRes.ok) {
                    const listData = await listRes.json();
                    if (Array.isArray(listData)) {
                        for (const item of listData) {
                            if (item.type === 'dir') {
                                const profile = await loadUserFile(item.name, 'profile', null);
                                if (profile && (profile.username === identifier || profile.email === identifier)) {
                                    foundUser = { username: item.name, profile: profile };
                                    break;
                                }
                            }
                        }
                    }
                } else if (listRes.status !== 404) {
                    throw new Error(`获取用户列表失败: ${listRes.status}`);
                }
                if (!foundUser) throw new Error('用户不存在');
                const creds = await loadUserFile(foundUser.username, 'credentials', null);
                if (!creds) throw new Error('凭证不存在');
                const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password + creds.salt));
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const inputHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                if (inputHash !== creds.password_hash) throw new Error('密码错误');
                const ops = await loadUserFile(foundUser.username, 'operations', []);
                ops.push({ action: '登录', details: `用户 ${foundUser.username} 登录`, created_at: new Date().toISOString() });
                await saveUserFile(foundUser.username, 'operations', ops, '记录登录');
                const user = { username: foundUser.username, email: foundUser.profile.email, display_name: foundUser.profile.display_name || foundUser.username, role: foundUser.profile.role || 'member', is_member: foundUser.profile.is_member || false };
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                msg.textContent = '✅ 登录成功！'; msg.className = 'message success';
                setTimeout(() => { window.location.href = 'index.html'; }, 500);
            } catch (err) {
                msg.textContent = '❌ ' + err.message;
                msg.className = 'message error';
            } finally {
                this.disabled = false;
            }
        });

        // ============================================================
        //  忘记密码
        // ============================================================
        document.getElementById('forgotBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            const form = document.getElementById('forgotForm');
            const msg = document.getElementById('forgotMessage');
            msg.textContent = '';
            msg.className = 'message';

            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) { msg.textContent = '⚠️ 请填写邮箱'; msg.className = 'message error'; return; }

            this.disabled = true;
            msg.textContent = '⏳ 发送中...';
            msg.className = 'message';

            try {
                const listRes = await fetch(`${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${USERS_DIR}?branch=main`);
                let foundUser = null;
                if (listRes.ok) {
                    const listData = await listRes.json();
                    for (const item of listData) {
                        if (item.type === 'dir') {
                            const profile = await loadUserFile(item.name, 'profile', null);
                            if (profile && profile.email === email) { foundUser = item.name; break; }
                        }
                    }
                } else if (listRes.status !== 404) {
                    throw new Error(`获取用户列表失败: ${listRes.status}`);
                }
                if (!foundUser) throw new Error('该邮箱未注册');
                const raw = await fetchEmailTemplate('reset_password');
                const resetLink = window.location.origin + '/login.html?reset=' + foundUser;
                const htmlContent = renderTemplate(raw, { email, reset_link: resetLink });
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email,
                    htmlContent: htmlContent
                });
                msg.textContent = '✅ 重置链接已发送至您的邮箱';
                msg.className = 'message success';
            } catch (err) {
                msg.textContent = '❌ ' + err.message;
                msg.className = 'message error';
            } finally {
                this.disabled = false;
            }
        });
    </script>
