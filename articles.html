<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章 · ZHDD网安空间</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif; background:#0b0e14; color:#e8edf5; min-height:100vh; display:flex; flex-direction:column; }
        a { text-decoration:none; color:inherit; }
        .navbar { background:rgba(13,18,28,0.92); backdrop-filter:blur(12px); border-bottom:1px solid rgba(0,255,200,0.15); padding:0 2rem; height:72px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 4px 30px rgba(0,0,0,0.5); }
        .logo { display:flex; align-items:center; gap:10px; font-size:1.5rem; font-weight:700; letter-spacing:1px; color:#00f5d4; text-shadow:0 0 20px rgba(0,245,212,0.2); }
        .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,#00f5d4,#0077b6); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#0b0e14; box-shadow:0 0 20px rgba(0,245,212,0.25); }
        .nav-links { display:flex; gap:4px; list-style:none; align-items:center; }
        .nav-links li { display:inline; }
        .nav-btn { background:transparent; border:none; color:#a0b4c8; font-size:1rem; font-weight:500; padding:8px 18px; border-radius:30px; cursor:pointer; transition:all .25s ease; font-family:inherit; letter-spacing:.3px; position:relative; }
        .nav-btn:hover { color:#fff; background:rgba(0,245,212,0.08); }
        .nav-btn.active { color:#00f5d4; background:rgba(0,245,212,0.12); box-shadow:0 0 20px rgba(0,245,212,0.06); }
        .nav-btn.active::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:20px; height:2px; background:#00f5d4; border-radius:4px; box-shadow:0 0 12px #00f5d4; }
        .nav-btn a { display:block; }
        .user-area { display:flex; align-items:center; gap:12px; }
        .btn-login { padding:8px 24px; background:linear-gradient(135deg,#00f5d4,#0077b6); border:none; border-radius:30px; color:#0b0e14; font-weight:700; font-size:.95rem; cursor:pointer; transition:.3s; font-family:inherit; box-shadow:0 4px 20px rgba(0,245,212,0.15); }
        .btn-login:hover { transform:scale(1.03); box-shadow:0 8px 30px rgba(0,245,212,0.25); }
        .btn-login a { color:#0b0e14; }
        .user-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#00f5d4,#0077b6); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.1rem; color:#0b0e14; cursor:pointer; transition:.3s; box-shadow:0 0 20px rgba(0,245,212,0.15); flex-shrink:0; }
        .user-avatar:hover { transform:scale(1.05); box-shadow:0 0 30px rgba(0,245,212,0.3); }
        .user-avatar.hidden { display:none; }
        .btn-login.hidden { display:none; }
        .main-container { flex:1; max-width:1200px; margin:0 auto; padding:2rem 1.5rem 3rem; width:100%; }
        .section-title { font-size:2rem; font-weight:700; margin-bottom:.5rem; color:#e8edf5; letter-spacing:1px; }
        .section-title .highlight { color:#00f5d4; }
        .section-sub { color:#8aa3bc; margin-bottom:2rem; font-size:1rem; }
        .articles-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem; }
        .articles-header .search-box { padding:8px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:30px; color:#e8edf5; font-size:.95rem; outline:none; width:100%; max-width:300px; transition:.3s; }
        .articles-header .search-box:focus { border-color:#00f5d4; box-shadow:0 0 0 3px rgba(0,245,212,0.08); }
        .article-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:1.2rem 1.5rem; margin-bottom:1rem; cursor:pointer; transition:.3s; }
        .article-item:hover { border-color:rgba(0,245,212,0.2); background:rgba(255,255,255,0.06); }
        .article-item .title { font-size:1.2rem; font-weight:600; color:#e8edf5; }
        .article-item .meta { font-size:.85rem; color:#8aa3bc; margin-top:4px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
        .article-item .meta .tag { background:rgba(0,245,212,0.08); padding:0 8px; border-radius:12px; font-size:.75rem; color:#00f5d4; }
        .article-item .meta .visibility { font-size:.7rem; padding:0 8px; border-radius:12px; background:rgba(255,255,255,0.05); }
        .article-item .summary { color:#b0c8dd; font-size:.95rem; margin-top:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.6; }
        .article-item .full-content { display:none; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06); color:#b8ccdd; line-height:1.8; font-size:.95rem; white-space:pre-wrap; }
        .article-item.expanded .full-content { display:block; }
        .article-item.expanded .summary { display:none; }
        .article-item .article-actions { margin-top:12px; display:flex; gap:12px; flex-wrap:wrap; }
        .article-item .article-actions button { background:transparent; border:none; color:#8aa3bc; cursor:pointer; font-size:.85rem; transition:.3s; font-family:inherit; display:flex; align-items:center; gap:4px; }
        .article-item .article-actions button:hover { color:#00f5d4; }
        .article-item .article-actions .liked { color:#00f5d4; }
        .article-item .comments-section { margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06); }
        .article-item .comments-section .comment-input { display:flex; gap:8px; margin-bottom:8px; }
        .article-item .comments-section .comment-input input { flex:1; padding:6px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:20px; color:#e8edf5; font-size:.9rem; outline:none; font-family:inherit; }
        .article-item .comments-section .comment-input input:focus { border-color:#00f5d4; }
        .article-item .comments-section .comment-input button { padding:6px 16px; background:linear-gradient(135deg,#00f5d4,#0077b6); border:none; border-radius:20px; color:#0b0e14; font-weight:600; cursor:pointer; font-size:.85rem; font-family:inherit; }
        .article-item .comments-section .comment-item { padding:.4rem 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:.9rem; }
        .article-item .comments-section .comment-item .comment-author { color:#00f5d4; font-weight:600; }
        .article-item .comments-section .comment-item .comment-content { color:#b8ccdd; }
        .article-item .comments-section .comment-item .comment-meta { font-size:.75rem; color:#5a738a; }
        .no-articles { text-align:center; padding:3rem; color:#5a738a; font-size:1.1rem; }
        .articles-loading { text-align:center; padding:3rem; color:#8aa3bc; font-size:1.1rem; }
        .footer { text-align:center; padding:2rem 1.5rem 1.5rem; border-top:1px solid rgba(255,255,255,0.04); color:#5a738a; font-size:.85rem; letter-spacing:.5px; background:rgba(13,18,28,0.6); backdrop-filter:blur(8px); }
        .footer span { color:#00f5d4; }
        .footer .admin-link { display:inline-block; margin-top:8px; color:#5a738a; font-size:.85rem; transition:.3s; border-bottom:1px dashed #5a738a; }
        .footer .admin-link:hover { color:#00f5d4; border-bottom-color:#00f5d4; }
        @media (max-width:820px) { .navbar { padding:0 1.2rem; height:64px; flex-wrap:wrap; } .logo { font-size:1.2rem; } .logo-icon { width:30px; height:30px; font-size:14px; } .nav-links { gap:2px; } .nav-btn { font-size:.8rem; padding:6px 12px; } .articles-header .search-box { max-width:100%; } .user-area .btn-login { padding:6px 16px; font-size:.85rem; } .user-area .user-avatar { width:34px; height:34px; font-size:.9rem; } }
        @media (max-width:480px) { .navbar { padding:0 .8rem; height:58px; } .nav-btn { font-size:.7rem; padding:4px 8px; } .logo { font-size:1rem; } .logo-icon { width:26px; height:26px; font-size:12px; } .article-item { padding:1rem; } .user-area .btn-login { padding:4px 12px; font-size:.75rem; } .user-area .user-avatar { width:30px; height:30px; font-size:.8rem; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="logo-icon">Z</span><span id="brandName">ZHDD 网安空间</span></div>
        <ul class="nav-links">
            <li><a href="index.html"><button class="nav-btn" id="navHome">首页</button></a></li>
            <li><a href="members.html"><button class="nav-btn" id="navMembers">成员</button></a></li>
            <li><a href="about.html"><button class="nav-btn" id="navAbout">简介</button></a></li>
            <li><a href="join.html"><button class="nav-btn" id="navJoin">加入我们</button></a></li>
            <li><a href="articles.html"><button class="nav-btn active" id="navArticles">文章</button></a></li>
        </ul>
        <div class="user-area">
            <button class="btn-login" id="loginNavBtn"><a href="login.html" id="loginLink">登录 / 注册</a></button>
            <div class="user-avatar hidden" id="userAvatar" title="个人中心"></div>
        </div>
    </nav>
    <div class="main-container">
        <div class="articles-header">
            <h2 class="section-title" id="articlesTitle" style="margin-bottom:0;">📄 文章列表</h2>
            <input type="text" id="articleSearch" class="search-box" placeholder="搜索标题..." />
        </div>
        <div id="articlesContainer"><div class="articles-loading">⏳ 加载文章中...</div></div>
    </div>
    <footer class="footer">
        <span id="footerCopyright">&copy; 2026 ZHDD 网安空间 — 守护数字边界 · 铸就安全未来</span><br />
        <a href="admin.html" class="admin-link" id="adminLink">🔧 管理后台</a>
    </footer>
    <script src="utils.js"></script>
    <script>
        let allArticles = [];
        async function loadArticles() {
            const container = document.getElementById('articlesContainer');
            container.innerHTML = '<div class="articles-loading">⏳ 加载文章中...</div>';
            try {
                const config = await loadSiteConfig();
                if (!config) { container.innerHTML = '<div class="no-articles">📭 暂无文章</div>'; return; }
                if (config.site_name) { document.title = config.site_name + ' · 文章'; document.getElementById('brandName').textContent = config.site_name; }
                if (config.nav) {
                    document.getElementById('navHome').textContent = config.nav.home || '首页';
                    document.getElementById('navMembers').textContent = config.nav.members || '成员';
                    document.getElementById('navAbout').textContent = config.nav.about || '简介';
                    document.getElementById('navJoin').textContent = config.nav.join || '加入我们';
                    document.getElementById('navArticles').textContent = config.nav.articles || '文章';
                    document.getElementById('loginLink').textContent = config.nav.login || '登录 / 注册';
                    document.getElementById('adminLink').textContent = config.nav.admin || '🔧 管理后台';
                }
                if (config.articles) {
                    document.getElementById('articlesTitle').textContent = config.articles.title || '📄 文章列表';
                    document.getElementById('articleSearch').placeholder = config.articles.search_placeholder || '搜索标题...';
                }
                const articles = config.articles?.list || [];
                allArticles = articles;
                renderArticles(articles, config);
                if (config.footer) { document.getElementById('footerCopyright').innerHTML = config.footer.copyright || ''; }
            } catch (e) { console.warn('加载文章失败', e); container.innerHTML = '<div class="no-articles">📭 暂无文章</div>'; }
        }

        function renderArticles(articles, config) {
            const container = document.getElementById('articlesContainer');
            if (!articles || articles.length === 0) { container.innerHTML = '<div class="no-articles">📭 暂无文章</div>'; return; }
            let html = '';
            for (const art of articles) {
                const summary = (art.content || '').substring(0, 150) + ((art.content || '').length > 150 ? '...' : '');
                const tags = (art.tags || []).map(t => `<span class="tag">#${t}</span>`).join('');
                const visMap = { 'public': '公开', 'private': '🔒 私密', 'members': '👥 成员' };
                const visibility = art.visibility ? `<span class="visibility">${visMap[art.visibility] || art.visibility}</span>` : '';
                html += `<div class="article-item" data-id="${art.id}">
                    <div class="title">${art.title || '无标题'}</div>
                    <div class="meta"><span>🕒 ${art.created_at ? new Date(art.created_at).toLocaleDateString() : '未知'}</span>${tags}${visibility}<span>📖 ${Math.ceil((art.content || '').length / 400)} 分钟</span></div>
                    <div class="summary">${summary}</div>
                    <div class="full-content">${art.content || ''}</div>
                    <div class="article-actions">
                        <button class="like-btn" data-id="${art.id}">❤️ <span class="like-count">${art.likes || 0}</span></button>
                        <button class="fav-btn" data-id="${art.id}">⭐ <span class="fav-count">${art.favorites || 0}</span></button>
                        <button class="comment-toggle">💬 ${(art.comments || []).length}</button>
                    </div>
                    <div class="comments-section" style="display:none;">
                        <div class="comment-input"><input type="text" placeholder="${config.articles?.comment_label || '写评论…'}" /><button class="comment-submit" data-id="${art.id}">${config.articles?.submit_comment || '发布'}</button></div>
                        <div class="comments-list">${(art.comments || []).map(c => `<div class="comment-item"><span class="comment-author">${c.author}</span> <span class="comment-content">${c.content}</span> <span class="comment-meta">${new Date(c.created_at).toLocaleDateString()}</span></div>`).join('')}</div>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
            // 事件绑定（与之前相同）
            document.querySelectorAll('.article-item').forEach(item => {
                item.addEventListener('click', function(e) { if (e.target.closest('button')) return; this.classList.toggle('expanded'); });
            });
            document.querySelectorAll('.comment-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) { e.stopPropagation(); const s = this.closest('.article-item').querySelector('.comments-section'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; });
            });
            document.querySelectorAll('.comment-submit').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const item = this.closest('.article-item');
                    const input = item.querySelector('.comment-input input');
                    const text = input.value.trim();
                    if (!text) return;
                    const user = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
                    if (!user.username) { alert('请先登录'); return; }
                    const id = this.dataset.id;
                    const article = allArticles.find(a => a.id === id);
                    if (article) {
                        if (!article.comments) article.comments = [];
                        article.comments.push({ author: user.display_name || user.username, content: text, created_at: new Date().toISOString() });
                        renderArticles(allArticles);
                    }
                });
            });
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', function(e) { e.stopPropagation(); const id = this.dataset.id; const article = allArticles.find(a => a.id === id); if (article) { article.likes = (article.likes || 0) + 1; renderArticles(allArticles); } });
            });
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', function(e) { e.stopPropagation(); const id = this.dataset.id; const article = allArticles.find(a => a.id === id); if (article) { article.favorites = (article.favorites || 0) + 1; renderArticles(allArticles); } });
            });
        }

        document.getElementById('articleSearch').addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            if (!keyword) { renderArticles(allArticles); return; }
            const filtered = allArticles.filter(a => (a.title || '').toLowerCase().includes(keyword) || (a.content || '').toLowerCase().includes(keyword));
            renderArticles(filtered);
        });

        function checkAuth() {
            const stored = sessionStorage.getItem('currentUser');
            if (stored) {
                try { const user = JSON.parse(stored); document.getElementById('loginNavBtn').classList.add('hidden'); const avatar = document.getElementById('userAvatar'); avatar.classList.remove('hidden'); avatar.textContent = (user.display_name || user.username || 'U').charAt(0).toUpperCase(); } catch (e) {}
            }
        }
        checkAuth();
        loadArticles();
    </script>
</body>
</html>
